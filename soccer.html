<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f4f6;--card:#ffffff;--card2:#f5f5f7;--line:#e4e4e8;--accent:#1d4ed8;--accent2:#3b82f6;--good:#16a34a;--warn:#f59e0b;--bad:#ef4444;--text:#131315;--sub:#6b6b74;--nav-h:64px;--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box}
body{margin:0;font-family:'Rubik',-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3,.section-title,.dash-greet{letter-spacing:-.01em}
.screen{min-height:100vh;display:flex;flex-direction:column}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--card2);color:var(--text);font-family:inherit;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 55%,black);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,white 10%),var(--accent) 45%,color-mix(in srgb,var(--accent) 82%,black) 100%);color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;transition:filter .15s,transform .1s;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 20px rgba(225,29,46,.25)}
.btn:active{transform:scale(.98);filter:brightness(.94)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);border:1.5px solid var(--line);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--line);border-color:var(--sub)}
.btn.sm{padding:7px 10px;font-size:12px;width:auto;display:inline-block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar b{font-size:15px;font-weight:700}
.topbar-user{text-align:center;flex:1}
.icon-btn-sm{border:none;background:var(--card2);font-size:16px;border-radius:10px;width:38px;height:38px;cursor:pointer;flex:none}
.content{flex:1;padding:14px 16px calc(var(--nav-h) + var(--sab) + 20px);overflow-y:auto}
.bottom-tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:30;box-shadow:0 -4px 16px rgba(20,15,10,.05)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border:none;background:none;padding:6px 2px;font-size:10.5px;color:var(--sub);cursor:pointer;text-align:center;position:relative;font-family:inherit;border-radius:10px}
.nav-btn .ic{font-size:20px;line-height:1}
.nav-btn.sel{color:var(--accent)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.search-overlay{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column}
.search-overlay-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.search-overlay-head input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:var(--card2);color:var(--text);font-family:inherit}
.search-overlay-head input:focus{outline:none;border-color:var(--accent)}
.search-results{overflow-y:auto;flex:1;padding:8px}
.search-group-title{font-size:12px;color:var(--sub);font-weight:700;padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.search-result-item{display:block;width:100%;border:none;background:none;padding:11px 10px;font-size:14px;color:var(--text);cursor:pointer;text-align:right;border-radius:10px}
.search-result-item:hover{background:var(--card2)}
.search-result-item .srm{color:var(--sub);font-size:11px;margin-right:6px}
.alert-card{border-right:4px solid var(--warn)}
.alert-card.danger{border-right:4px solid var(--bad)}
.section-title{font-size:18px;font-weight:700;margin:6px 0 12px}
.dash-header{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),color-mix(in srgb,var(--accent) 10%,var(--card)));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--card));border-radius:16px;padding:18px 16px;margin-bottom:14px}
.dash-header .dash-greet{font-size:20px;font-weight:800;margin:0 0 4px}
.dash-header .dash-date{font-size:13px;color:var(--sub)}
.dash-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.dash-stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.dash-stat-ic{width:38px;height:38px;flex:none;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,var(--card));color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px}
.dash-stat-num{font-size:20px;font-weight:800;line-height:1.1}
.dash-stat-label{font-size:11px;color:var(--sub)}
.dash-alert-row{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.dash-alert-row.danger{border-right-color:var(--bad)}
.dash-alert-ic{flex:none;font-size:16px;line-height:1.4}
.dash-alert-text{font-size:13px;line-height:1.4}
.dash-empty-ok{text-align:center;color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card));border:1px solid color-mix(in srgb,var(--good) 40%,var(--card));border-radius:12px;padding:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pitch-wrap{background:var(--card);border-radius:14px;padding:10px;margin-bottom:12px;overflow:hidden}
#pitchSvg{width:100%;height:auto;touch-action:none;background:#3eac46;border-radius:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar button{flex:1;min-width:90px;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer}
.toolbar button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbox-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.toolbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tbx-btn{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tbx-btn span{font-size:12px;color:var(--sub)}
.tbx-btn.sel{background:var(--accent);border-color:var(--accent)}
.tbx-btn.sel span{color:#fff}
.color-row{display:flex;gap:10px;margin-bottom:10px;justify-content:center}
.color-sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.color-sw.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(14,165,184,.35)}
.howto{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.frame-status{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center}
.drill-card{cursor:pointer}
.drill-card.active{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}

.builder-screen{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.builder-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.icon-btn{border:none;background:var(--card2);font-size:20px;border-radius:10px;width:42px;height:42px;cursor:pointer;flex:none}
.icon-btn.save{background:var(--good);color:#fff}
.builder-name-input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-weight:700}
.builder-body{flex:1;overflow-y:auto;padding:10px 12px 30px}
.pitch-stage{background:var(--card);border-radius:14px;padding:8px;margin-bottom:10px}
.pitch-stage .pitch-wrap{margin-bottom:0}
.tool-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.tool-strip .tbx-btn{flex:none;min-width:64px}
.toolbox.grid-fallback{display:none}
.action-row{display:flex;gap:8px;margin-bottom:10px}
.action-row button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer}
.action-row button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.frames-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.frame-chip{flex:none;width:78px;text-align:center;cursor:pointer}
.frame-chip svg{width:78px;height:52px;background:#3eac46;border-radius:8px;border:2px solid transparent}
.frame-chip.active svg{border-color:var(--accent)}
.frame-chip .lbl{font-size:11px;color:var(--sub);margin-top:3px}
.frame-add-chip{flex:none;width:78px;height:52px;border-radius:8px;border:2px dashed #c8cdd5;background:none;font-size:24px;color:var(--sub);cursor:pointer}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:70}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.logout-btn{background:transparent;border:none;font-size:16px;cursor:pointer;padding:2px 6px}
.badge{display:inline-block;background:var(--card2);color:var(--sub);font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
.phase-block{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:10px}
.phase-drill-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.pbadge-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.pbadge-item{flex-shrink:0;width:58px;text-align:center}
.pbadge-item .ic{font-size:22px;background:var(--card2);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 3px}
.pbadge-item.locked .ic{opacity:.3;filter:grayscale(1)}
.pbadge-item .t{font-size:9px;color:var(--sub);line-height:1.2}
.pbar-outer{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:5px}
.pbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.injury-tag{font-size:10px;padding:2px 8px;border-radius:10px;margin-top:3px;display:inline-block;background:var(--bad);color:#fff;font-weight:700}
.injury-tag.rehab{background:var(--warn);color:#241a00}
.report-page{background:#fff;border-radius:14px;padding:18px;max-width:680px;margin:0 auto}
.report-header{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:14px}
.report-header img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.report-header .ph-fallback{width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.report-title{font-size:19px;font-weight:800}
.report-sub{font-size:13px;color:var(--sub);margin-top:2px}
.report-section{margin-bottom:14px}
.report-section .st{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;border-right:3px solid var(--accent);padding-right:6px}
.report-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #eef0f4}
.report-feedback{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
@media print{
  .no-print{display:none !important}
  body,#appScreen,.builder-screen{background:#fff !important}
  .builder-body{overflow:visible !important;padding:0 !important}
  .report-page{box-shadow:none;max-width:100%}
}

@media (min-width:880px){
  body{display:flex;justify-content:center}
  #appScreen{min-height:100vh;width:100%;max-width:1200px}

}

<script>
var firebaseConfig = {apiKey:"AIzaSyBKOCyFdiy95SxddD_Iy6Gkq4aBsqkrFdE",authDomain:"soccer-26e99.firebaseapp.com",projectId:"soccer-26e99",storageBucket:"soccer-26e99.firebasestorage.app",messagingSenderId:"870862038298",appId:"1:870862038298:web:a58fde35acf1e79b9738a3"};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var P = 'fc_';

var ME = {uid:'', phone:'', name:'', role:'coach', clubId:'', isSuperAdmin:false};
function clubScopeId(){ return ME.clubId || ME.uid; }
function clubOwnerUid(){
  if(ME.role==='manager') return ME.uid;
  return MY_CLUB ? MY_CLUB.adminUid : '';
}
function memberInfoFor(uid){
  if(!MY_CLUB || !uid) return null;
  if(uid===MY_CLUB.adminUid) return null; // owner is structurally unrestricted, never stored/consulted
  var mi = MY_CLUB.memberInfo || {};
  return mi[uid] || null;
}
// effectiveCategories(uid?): null = unrestricted (owner, or legacy member with no stored record), else array of allowed category keys
function effectiveCategories(uid){
  uid = uid || ME.uid;
  if(!MY_CLUB) return null;
  if(uid===MY_CLUB.adminUid) return null;
  var info = memberInfoFor(uid);
  if(!info) return null; // legacy member, never configured -> unrestricted
  if(!info.assignedCategories || !info.assignedCategories.length) return null; // empty/all = unrestricted
  return info.assignedCategories;
}
function categoryAllowed(cat, uid){
  var eff = effectiveCategories(uid);
  return eff===null || eff.indexOf(cat)!==-1;
}
var TAB = 0;
var NAV_TABS = [
  {id:0, ic:'📋', t:'תוכניות אימון'},
  {id:1, ic:'👥', t:'קבוצות'},

];
var TRAINING_PLANS = [];

var DRILL_LIB = [];
var DRILL_LIB_LOADED = false;
var DRILL_CATEGORIES = ['חימום','טכניקה','כוח','משחק','סיום'];
var editingDrillLibItem = null;
var drillPickerCallback = null;

/* ---------------- Fixed warmup/cooldown reference libraries ---------------- */

  {title:'ריצה קלה', description:'ריצה קלה בקצב נוח להעלאת דופק', duration_min:5},

  {title:'עבודת רגליים', description:'תרגילי קואורדינציה וזריזות רגליים עם סולם/קונוסים', duration_min:5},
  {title:'חימום עם כדור', description:'מסירות קצרות בזוגות + ריצת סלאלום בין קונוסים', duration_min:8},
  {title:'משחק תופסת/עוקץ', description:'משחק קצר לחימום כללי והרמת דופק', duration_min:5},
  {title:'FIFA 11+', description:'תוכנית חימום מונעת פציעות — שיווי משקל, כוח ליבה וזריזות', duration_min:10},
  {title:'דילוגי חבל', description:'דילוגי חבל ותרגילי קואורדינציה רגליים-ידיים', duration_min:5}
];
var COOLDOWN_LIBRARY = [
  {title:'הליכה קלה', description:'הליכה קלה להורדת קצב לב בהדרגה', duration_min:5},
  {title:'מתיחות סטטיות', description:'מתיחות סטטיות לשרירי הרגליים', duration_min:7},
  {title:'ריצה איטית', description:'ריצה איטית/הליכה מהירה לשחרור הגוף', duration_min:5},
  {title:'תרגילי נשימה', description:'תרגילי נשימה והרפיה', duration_min:5},
  {title:'מתיחות לגב התחתון', description:'מתיחות לגב התחתון ולמותניים', duration_min:5},
  {title:'מתיחות זוגיות', description:'מתיחות זוגיות מודרכות בעזרת שותף', duration_min:5},
  {title:'סיכום קבוצתי', description:'סיכום קצר עם הקבוצה והתייחסות לאימון', duration_min:3}
];

var AGE_GROUPS =['נוער','נערים א\'','נערים ב\'','נערים ג\'','ילדים א\'','ילדים ב\'','ילדים ג\'','טרום א\'','טרום ב\'','טרום ג\'','בית הספר לכדורגל'];
var CLUB_TEAMS = {};
var CLUB_TEAMS_LOADED = false;
var currentTeamCategory = null;

/* ---------------- Group training plans (per age-group, club-scoped) ---------------- */
var GROUP_PLANS_CACHE = {};
var currentGroupPlan = null;

/* ---------------- Coach reusable training-session template library ---------------- */
var COACH_TRAININGS = [];
var COACH_TRAININGS_LOADED = false;
var editingCoachTraining = null;
var coachTrainingPickerCallback = null;

/* ---------------- Match video analysis ---------------- */
var MATCHES = [];
var MATCHES_LOADED = false;
var MATCH_EVENTS = [];
var MATCH_EVENTS_LOADED = false;
var currentMatchId = null;
var MATCH_EVENT_TYPES = [
  {k:'goal', ic:'⚽', t:'שער'},
  {k:'assist', ic:'🎯', t:'בישול'},
  {k:'key_pass', ic:'🔑', t:'מסירה מפתחת'},
  {k:'shot', ic:'🥅', t:'בעיטה לשער'},
  {k:'save', ic:'🧤', t:'הצלה'},
  {k:'tackle', ic:'🛡', t:'שלילת כדור'},
  {k:'yellow', ic:'🟨', t:'כרטיס צהוב'},
  {k:'red', ic:'🟥', t:'כרטיס אדום'},
  {k:'sub_in', ic:'🔼', t:'החלפה — נכנס/ת'},
  {k:'sub_out', ic:'🔽', t:'החלפה — יצא/ה'},
  {k:'other', ic:'📝', t:'הערה כללית'}
];
function matchEventTypeInfo(k){
  for(var i=0;i<MATCH_EVENT_TYPES.length;i++) if(MATCH_EVENT_TYPES[i].k===k) return MATCH_EVENT_TYPES[i];
  return {k:k, ic:'📝', t:k};
}
function loadMatches(){
  if(!ME.uid) return;
  db.collection(P+'matches').where('coachUid','==',ME.uid).get().then(function(snap){
    MATCHES = snap.docs.map(function(d){ return d.data(); });
    MATCHES_LOADED = true;
    if(TAB===4 || TAB===2) renderTab(TAB);
    if(currentMatchId) renderMatchDetail();
  });
}
function loadMatchEvents(){
  if(!ME.uid) return;
  db.collection(P+'matchevents').where('coachUid','==',ME.uid).get().then(function(snap){
    MATCH_EVENTS = snap.docs.map(function(d){ return d.data(); });
    MATCH_EVENTS_LOADED = true;
    if(TAB===4) renderTab(4);
    if(currentMatchId) renderMatchDetail();
  });
}
function matchById(id){
  for(var i=0;i<MATCHES.length;i++) if(MATCHES[i].id===id) return MATCHES[i];
  return null;
}
function eventsForMatch(matchId){
  return MATCH_EVENTS.filter(function(e){ return e.matchId===matchId; })
    .sort(function(a,b){ return (a.minute||0)-(b.minute||0); });
}
function tplMatches(){
  if(!MATCHES_LOADED || !CLUB_TEAMS_LOADED){
    loadMatches();
    return '<div class="section-title">🎥 ניתוח משחקים</div><div class="muted" style="text-align:center">טוען...</div>';
  }
  var visible = MATCHES.filter(function(m){ return categoryAllowed(m.category); })
    .slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  return '<div class="section-title">🎥 ניתוח משחקים</div>'+
    '<div class="muted" style="margin-bottom:10px">קשר/י סרטון משחק ותייג/י אירועים על ציר הזמן</div>'+
    '<button class="btn" id="btnAddMatch" style="margin-bottom:14px">+ משחק חדש</button>'+
    (visible.length===0
      ? '<div class="card" style="text-align:center;color:var(--sub)">עדיין לא נוספו משחקים</div>'
      : visible.map(function(m){
          var hasScore = m.score_us!==''&&m.score_us!=null && m.score_them!==''&&m.score_them!=null;
          return '<div class="card" data-openmatch="'+m.id+'" style="cursor:pointer">'+
            '<div class="row"><b>'+(m.opponent||'משחק')+'</b><span class="badge">'+m.category+'</span></div>'+
            '<div class="muted" style="margin-top:4px">'+(m.date||'')+(hasScore?' · '+m.score_us+' - '+m.score_them:'')+'</div>'+
            (m.videoUrl ? '<div class="muted" style="margin-top:2px">🎬 סרטון מקושר</div>' : '')+
          '</div>';
        }).join('')
    );
}
function openAddMatchModal(){
  var cats = AGE_GROUPS.filter(function(c){ return categoryAllowed(c); });
  var html = '<h3 style="margin-bottom:14px">+ משחק חדש</h3>'+
    '<div class="field"><label>קבוצת גילאים</label><select id="mCategoryInput">'+
      cats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="field"><label>יריבה</label><input id="mOpponentInput" placeholder="שם הקבוצה היריבה"></div>'+
    '<div class="field"><label>תאריך</label><input type="date" id="mDateInput" value="'+todayIso()+'"></div>'+

    '<button class="btn" id="btnSaveMatch">שמור משחק</button>';
  openModal(html);
  document.getElementById('btnSaveMatch').onclick = function(){
    var opponent = document.getElementById('mOpponentInput').value.trim();
    if(!opponent) return;
    var m = {
      id: genCode(8),
      coachUid: ME.uid,
      category: document.getElementById('mCategoryInput').value,
      opponent: opponent,

      videoUrl: document.getElementById('mVideoInput').value.trim(),
      score_us: '', score_them: '',

      closeModal();
      openMatchDetail(m.id);
    });

}
function openMatchDetail(id){
  currentMatchId = id;
  document.getElementById('matchScreen').style.display = 'flex';

}

  document.getElementById('matchScreen').style.display = 'none';

}
function videoEmbedHtml(url){
  if(!url) return '';
  var yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
  if(yt){
    return '<div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin-bottom:12px">'+
      '<iframe src="https://www.youtube.com/embed/'+yt[1]+'" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe>'+
    '</div>';
  }
  return '<a href="'+url+'" target="_blank" rel="noopener" class="btn ghost" style="margin-bottom:12px;display:block;text-align:center">🎬 פתח סרטון</a>';
}
function renderMatchDetail(){
  var m = matchById(currentMatchId);
  var body = document.getElementById('matchScreenBody');
  if(!m){ document.getElementById('matchScreenTitle').textContent = ''; body.innerHTML = ''; return; }
  document.getElementById('matchScreenTitle').textContent = (m.opponent||'משחק')+' · '+(m.date||'');
  var roster = (CLUB_TEAMS[m.category] || {players:[]}).players || [];
  var evs = eventsForMatch(m.id);
  body.innerHTML =
    '<div class="card">'+
      '<div class="row"><b>'+m.category+'</b><span class="muted">'+(m.date||'')+'</span></div>'+
      '<div class="field" style="margin-top:10px"><label>תוצאה (אנחנו — הם)</label>'+
        '<div class="row" style="gap:8px;justify-content:flex-start">'+
          '<input id="mScoreUsInput" type="number" style="width:70px" value="'+(m.score_us!=null?m.score_us:'')+'">'+
          '<span>—</span>'+
          '<input id="mScoreThemInput" type="number" style="width:70px" value="'+(m.score_them!=null?m.score_them:'')+'">'+
          '<button class="btn ghost sm" id="btnSaveScore">שמור</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    videoEmbedHtml(m.videoUrl)+
    '<div class="section-title" style="font-size:16px">⏱ ציר אירועים</div>'+
    (evs.length===0 ? '<div class="muted" style="margin-bottom:10px">אין עדיין אירועים מתויגים</div>' :
      evs.map(function(e){
        var info = matchEventTypeInfo(e.type);
        return '<div class="card" style="padding:10px 12px"><div class="row">'+
          '<div>'+info.ic+' <b>'+(e.minute!=null&&e.minute!==''?e.minute+'\' ':'')+info.t+'</b>'+(e.playerName?' — '+e.playerName:'')+
            (e.note ? '<div class="muted" style="font-size:11px;margin-top:2px">'+e.note+'</div>' : '')+
          '</div>'+
          '<button class="logout-btn" data-delevent="'+e.id+'" title="מחק">🗑</button>'+
        '</div></div>';
      }).join('')
    )+
    '<button class="btn ghost sm" id="btnAddEvent" style="margin-bottom:16px">+ הוסף אירוע</button>'+

function todayIso(){
  var d = new Date();
  var mm = (''+(d.getMonth()+1)).padStart ? (''+(d.getMonth()+1)).padStart(2,'0') : ((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);
  var dd = (''+d.getDate()).padStart ? (''+d.getDate()).padStart(2,'0') : (d.getDate()<10?'0':'')+d.getDate();
  return d.getFullYear()+'-'+mm+'-'+dd;
}

/* ---------------- Alerts / reminders ---------------- */
function daysBetween(dateStr){
  // returns (dateStr - today) in days, dateStr is 'YYYY-MM-DD'
  var d = new Date(dateStr+'T00:00:00');
  var today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((d.getTime()-today.getTime())/86400000);
}
function findPlayerCategory(name){
  for(var i=0;i<AGE_GROUPS.length;i++){
    var t = CLUB_TEAMS[AGE_GROUPS[i]];
    if(t && t.players && t.players.some(function(pl){ return pl.name===name; })) return AGE_GROUPS[i];
  }
  return '';
}
function computeAlerts(){
  var alerts = [];
  var byPlayer = {};
  SESSIONS.forEach(function(s){
    var att = s.attendance || {};
    for(var name in att){
      if(!byPlayer[name]) byPlayer[name] = [];
      byPlayer[name].push({date:s.date, start:s.start, val:att[name]});
    }
  });
  for(var name in byPlayer){
    var records = byPlayer[name].slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return a.start<b.start?-1:1;
    });
    var streak = 0;
    for(var i=0;i<records.length;i++){
      if(records[i].val==='absent') streak++; else streak = 0;
    }
    if(streak>=3){
      var cat = findPlayerCategory(name);
      if(categoryAllowed(cat)){
        alerts.push({type:'absence', severity:'danger', category:cat, playerName:name,
          text:'לשחקן '+name+' 3 היעדרויות רצופות'});
      }
    }
  }
  return alerts;
}
/* ---------------- Global search (hamburger drawer) ---------------- */
function globalSearch(query){
  var q = (query||'').trim().toLowerCase();
  var res = {players:[], coaches:[], teams:[]};
  if(!q) return res;
  AGE_GROUPS.forEach(function(cat){
    if(!categoryAllowed(cat)) return;
    if(cat.toLowerCase().indexOf(q)!==-1){
      res.teams.push({name:cat, category:cat});
    }
    var t = CLUB_TEAMS[cat];
    if(!t) return;
    (t.players||[]).forEach(function(p){
      if(p.name && p.name.toLowerCase().indexOf(q)!==-1){
        res.players.push({name:p.name, category:cat});
      }
    });
    (t.staff||[]).forEach(function(s){
      if(s.name && s.name.toLowerCase().indexOf(q)!==-1){
        res.coaches.push({name:s.name, category:cat, role:s.role||''});
      }
    });
  });
  return res;
}
function globalSearchResultsHtml(res){
  var parts = [];
  if(res.players.length){
    parts.push('<div class="search-group-title">שחקנים</div>');
    res.players.forEach(function(p,i){
      parts.push('<button class="search-result-item" data-srtype="player" data-sridx="'+i+'">👤 '+p.name+'<span class="srm">'+p.category+'</span></button>');
    });
  }
  if(res.coaches.length){
    parts.push('<div class="search-group-title">מאמנים</div>');
    res.coaches.forEach(function(c,i){
      parts.push('<button class="search-result-item" data-srtype="coach" data-sridx="'+i+'">🧑‍💼 '+c.name+'<span class="srm">'+c.category+'</span></button>');
    });
  }
  if(res.teams.length){
    parts.push('<div class="search-group-title">קבוצות</div>');
    res.teams.forEach(function(t,i){
      parts.push('<button class="search-result-item" data-srtype="team" data-sridx="'+i+'">👥 '+t.name+'</button>');
    });
  }
  if(!parts.length){
    parts.push('<div class="muted" style="padding:10px">לא נמצאו תוצאות</div>');
  }
  return parts.join('');
}

function upcomingBirthdays(){
  var today = new Date(); today.setHours(0,0,0,0);
  var list = [];
  AGE_GROUPS.forEach(function(cat){
    if(!categoryAllowed(cat)) return;
    var t = CLUB_TEAMS[cat];
    if(!t || !t.players) return;
    t.players.forEach(function(p){
      if(!p.birth_date) return;
      var parts = p.birth_date.split('-');
      if(parts.length!==3) return;
      var bMonth = parseInt(parts[1],10)-1, bDay = parseInt(parts[2],10);
      var next = new Date(today.getFullYear(), bMonth, bDay);
      if(next < today) next = new Date(today.getFullYear()+1, bMonth, bDay);
      var daysUntil = Math.round((next.getTime()-today.getTime())/86400000);
      if(daysUntil<=30) list.push({name:p.name, category:cat, date:next, daysUntil:daysUntil});
    });
  });
  list.sort(function(a,b){ return a.daysUntil-b.daysUntil; });
  return list;
}
function dashBirthdaysHtml(){
  var list = upcomingBirthdays();
  if(list.length===0) return '';
  return '<div class="section-title" style="font-size:15px">🎂 ימי הולדת קרובים</div>'+
    list.map(function(b){
      var label = b.daysUntil===0 ? 'היום!' : (b.daysUntil===1 ? 'מחר' : 'בעוד '+b.daysUntil+' ימים');
      return '<div class="card" style="padding:10px"><div class="row"><b>'+b.name+'</b><span class="muted">'+label+'</span></div>'+
        '<div class="muted" style="font-size:11px;margin-top:2px">'+b.category+' · '+fmtDateShort(b.date)+'</div></div>';
    }).join('');
}
function alertSeverityIcon(a){
  if(a.severity==='danger') return '🔴';
  return '🟡';
}
function alertsSectionHtml(alerts){
  if(!alerts) alerts = computeAlerts();
  var head = '<div class="row" style="margin-bottom:8px"><div class="section-title" style="margin:0">🔔 התראות</div>'+
    (alerts.length>0 ? '<span class="badge">'+alerts.length+'</span>' : '')+'</div>';
  if(alerts.length===0){
    return head+'<div class="dash-empty-ok">הכל תקין ✅</div>';
  }
  var sorted = alerts.slice().sort(function(a,b){
    if(a.severity===b.severity) return 0;
    return a.severity==='danger' ? -1 : 1;
  });
  return head + sorted.map(function(a){
    return '<div class="dash-alert-row'+(a.severity==='danger'?' danger':'')+'">'+
      '<div class="dash-alert-ic">'+alertSeverityIcon(a)+'</div>'+
      '<div class="dash-alert-text">'+a.text+
        (a.category ? '<div class="muted" style="margin-top:2px;font-size:11px">'+a.category+'</div>' : '')+
      '</div>'+
    '</div>';
  }).join('');
}

function loadClubTeams(){
  if(!ME.uid) return;
  db.collection(P+'clubteams').doc(clubScopeId()).get().then(function(doc){
    CLUB_TEAMS = (doc.exists && doc.data().categories) ? doc.data().categories : {};
    AGE_GROUPS.forEach(function(cat){ if(!CLUB_TEAMS[cat]) CLUB_TEAMS[cat] = {staff:[], players:[]}; });

function openGroupPlanModal(){
  var cat = currentTeamCategory;

  openModal('<h3 style="margin-bottom:14px">📋 תוכנית קבוצתית — '+cat+'</h3><div class="muted" style="text-align:center">טוען...</div>');
  var docId = groupPlanDocId(cat);
  if(GROUP_PLANS_CACHE[docId]){
    renderGroupPlanModal(cat, GROUP_PLANS_CACHE[docId]);
    return;
  }
  db.collection(P+'groupplans').doc(docId).get().then(function(doc){
    var data = doc.exists ? doc.data() : {category:cat, daily_notes:'', weekly_notes:'', yearly_notes:''};
    GROUP_PLANS_CACHE[docId] = data;

  }).catch(function(){

function visitingPlayersForCategory(cat){
  var res = [];
  AGE_GROUPS.forEach(function(homeCat){
    if(homeCat===cat) return;
    var ht = CLUB_TEAMS[homeCat];
    if(!ht || !ht.players) return;
    ht.players.forEach(function(pl){
      if(pl.extra_categories && pl.extra_categories.indexOf(cat)!==-1){
        res.push({player:pl, homeCategory:homeCat});
      }
    });
  });
  return res;
}

/* ---------------- Player badges / achievements ---------------- */
var PHYSICAL_ATTRS = [
  {k:'rating_speed', l:'מהירות'},
  {k:'rating_strength', l:'כוח'},
  {k:'rating_technique', l:'טכניקה'},
  {k:'rating_endurance', l:'סבולת'}
];
var BADGES = [
  {id:'attend10', ic:'🏅', t:'10 אימונים', d:'נוכחות ב-10 אימונים לפחות'},
  {id:'attend25', ic:'🎖️', t:'25 אימונים', d:'נוכחות ב-25 אימונים לפחות'},
  {id:'streak5', ic:'🔥', t:'רצף נוכחות', d:'5 אימונים רצופים ברצף ללא היעדרות'},
  {id:'fullskills', ic:'⭐', t:'שחקן מצטיין', d:'כל המדדים הפיזיים (1-5) בציון 4 ומעלה'}
];
function countPlayerAttendance(playerName){
  var records = [];
  SESSIONS.forEach(function(s){
    var val = (s.attendance||{})[playerName];
    if(val!==undefined) records.push({date:s.date, start:s.start, val:val});
  });
  records.sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return a.start<b.start?-1:1;
  });
  var present=0, maxStreak=0, curStreak=0;
  records.forEach(function(r){
    if(r.val==='present'){ present++; curStreak++; if(curStreak>maxStreak) maxStreak=curStreak; }
    else curStreak=0;
  });
  return {present:present, maxStreak:maxStreak, total:records.length};
}
function computePlayerBadges(player){
  var earned = {};
  var stats = countPlayerAttendance(player.name);
  if(stats.present>=10) earned.attend10 = true;
  if(stats.present>=25) earned.attend25 = true;
  if(stats.maxStreak>=5) earned.streak5 = true;
  var allHigh = PHYSICAL_ATTRS.every(function(a){ return (typeof player[a.k]==='number' ? player[a.k] : 0)>=4; });
  if(allHigh) earned.fullskills = true;
  return earned;
}
function playerBadgeRowHtml(player){
  var earned = computePlayerBadges(player);
  return '<div class="pbadge-row">'+BADGES.map(function(b){
    var got = !!earned[b.id];
    return '<div class="pbadge-item '+(got?'':'locked')+'" title="'+b.t+' — '+b.d+'"><div class="ic">'+b.ic+'</div><div class="t">'+b.t+'</div></div>';
  }).join('')+'</div>';
}
function playerPhysicalBarsHtml(player){
  return PHYSICAL_ATTRS.map(function(a){
    var v = (player && typeof player[a.k]==='number') ? player[a.k] : 0;
    return '<div style="margin-bottom:8px"><div class="row"><span style="font-size:12px">'+a.l+'</span><span class="muted">'+v+'/5</span></div>'+
      '<div class="pbar-outer"><div class="pbar-fill" style="width:'+(v*20)+'%"></div></div></div>';
  }).join('');
}
function ratingSelect(id, selected){
  var opts = '';
  for(var i=1;i<=5;i++) opts += '<option value="'+i+'"'+(i===selected?' selected':'')+'>'+i+'</option>';

var SESSIONS = [];
var SESSIONS_LOADED = false;
var CAL_TEAM_FILTER = '';
var CAL_DAY_LABELS = ['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'];
var TEAM_COLORS = ['#e11d2e','#2563eb','#16a34a','#d97706','#9333ea','#0891b2','#db2777','#65a30d'];
function teamColor(cat){
  var idx = AGE_GROUPS.indexOf(cat);
  return TEAM_COLORS[(idx<0?0:idx) % TEAM_COLORS.length];
}
function calWeekStart(d){
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
var CAL_WEEK_START = calWeekStart(new Date());
function calAddDays(d, n){
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  dt.setDate(dt.getDate() + n);
  return dt;
}
function calIso(d){
  var mm = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear()+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;
}
function calFmtShort(d){ return d.getDate()+'/'+(d.getMonth()+1); }
function loadSessions(){
  if(!ME.uid) return;
  db.collection(P+'sessions').where('coachUid','==',clubScopeId()).get().then(function(snap){
    SESSIONS = snap.docs.map(function(d){ return d.data(); });
    SESSIONS_LOADED = true;
    if(TAB===2) renderTab(2);
    refreshAlertsUI();
  });
}
function saveSession(s){
  db.collection(P+'sessions').doc(s.id).set(s);
}
function sessionsForDay(iso){
  return SESSIONS.filter(function(s){
    return s.date===iso && categoryAllowed(s.category) && (!CAL_TEAM_FILTER || s.category===CAL_TEAM_FILTER);
  }).sort(function(a,b){ return a.start<b.start?-1:1; });
}
function matchesForDay(iso){
  var list = (typeof MATCHES!=='undefined' && MATCHES_LOADED) ? MATCHES : [];
  return list.filter(function(m){
    return m.date===iso && categoryAllowed(m.category) && (!CAL_TEAM_FILTER || m.category===CAL_TEAM_FILTER);
  });
}
function tplCalendar(){
  if(!SESSIONS_LOADED){
    loadSessions();
    return '<div class="section-title">📅 לוח אימונים</div><div class="muted" style="text-align:center">טוען...</div>';
  }
  if(!MATCHES_LOADED) loadMatches();
  var teamOptions = AGE_GROUPS.filter(function(c){ return categoryAllowed(c); });
  var days = [];
  for(var i=0;i<7;i++) days.push(calAddDays(CAL_WEEK_START, i));
  var weekEnd = days[6];
  var anyContent = false;
  var daysHtml = days.map(function(d){
    var iso = calIso(d);
    var daySessions = sessionsForDay(iso);
    var dayMatches = matchesForDay(iso);
    if(daySessions.length===0 && dayMatches.length===0) return '';
    anyContent = true;
    return '<div class="section-title" style="font-size:14px;margin-top:14px">'+CAL_DAY_LABELS[d.getDay()]+' · '+calFmtShort(d)+'</div>'+
      daySessions.map(function(s){
        return '<div class="card" data-opensession="'+s.id+'" style="cursor:pointer;border-right:4px solid '+teamColor(s.category)+'">'+
          '<div class="row"><b>'+s.category+'</b><span class="muted">'+s.start+' - '+s.end+'</span></div>'+
          (s.location ? '<div class="muted" style="margin-top:2px">📍 '+s.location+'</div>' : '')+
        '</div>';
      }).join('')+
      dayMatches.map(function(m){
        var hasScore = m.score_us!==''&&m.score_us!=null && m.score_them!==''&&m.score_them!=null;
        return '<div class="card" data-openmatchcal="'+m.id+'" style="cursor:pointer;border-right:4px solid var(--text)">'+
          '<div class="row"><b>⚽ '+m.category+' נגד '+(m.opponent||'')+'</b>'+(hasScore?'<span class="muted">'+m.score_us+'-'+m.score_them+'</span>':'')+'</div>'+
        '</div>';
      }).join('');
  }).join('');
  return '<div class="section-title">📅 לוח אימונים</div>'+
    '<div class="field"><label>סינון לפי קבוצה</label><select id="calTeamFilter">'+
      '<option value="">כל הקבוצות</option>'+
      teamOptions.map(function(cat){ return '<option value="'+cat+'"'+(CAL_TEAM_FILTER===cat?' selected':'')+'>'+cat+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="btn ghost sm" id="btnCalPrev" style="width:auto">◀ שבוע קודם</button>'+
      '<b style="text-align:center;flex:1">'+calFmtShort(CAL_WEEK_START)+' - '+calFmtShort(weekEnd)+'</b>'+
      '<button class="btn ghost sm" id="btnCalNext" style="width:auto">שבוע הבא ▶</button>'+
    '</div>'+
    '<button class="btn" id="btnAddSession" style="margin-bottom:14px">+ אימון חדש</button>'+
    daysHtml +
    (anyContent ? '' : '<div class="card" style="text-align:center;color:var(--sub)">אין אימונים או משחקים השבוע</div>');
}

var MY_CLUB = null;

var CLUB_COACH_NAMES = {};
var DEFAULT_ACCENT = '#1d4ed8';
// Known Israeli club names -> real-world brand color, for auto-suggesting a club color on
// creation (see detectClubColor). Matched by substring against the club name the manager
// types in, so "הפועל תל אביב בית"ר..." style variants still hit. Not exhaustive -- managers
// can always override via the color picker.
var CLUB_BRAND_COLORS = [
  {match:['הפועל תל אביב'], color:'#e11d2e'},
  {match:['ביתר ירושלים'], color:'#f2c200'},
  {match:['מכבי חיפה'], color:'#0a8a3c'},
  {match:['מכבי תל אביב'], color:'#f2c200'},
  {match:['הפועל באר שבע'], color:'#e11d2e'},
  {match:['הפועל חיפה'], color:'#e11d2e'},
  {match:['בני יהודה'], color:'#8b1e3f'},
  {match:['מכבי נתניה'], color:'#1d4ed8'},
  {match:['מכבי פתח תקווה'], color:'#1d4ed8'},
  {match:['הפועל פתח תקווה'], color:'#e11d2e'},
  {match:['עירוני קריית שמונה','קרית שמונה'], color:'#1d4ed8'},
  {match:['בני סכנין','סכנין'], color:'#e11d2e'},
  {match:['אשדוד'], color:'#1d4ed8'},
  {match:['הפועל ירושלים'], color:'#e11d2e'},
  {match:['הפועל רמת גן'], color:'#e11d2e'},
  {match:['מכבי הרצליה'], color:'#1d4ed8'},
  {match:['הפועל כפר סבא'], color:'#e11d2e'},
  {match:['הפועל עכו'], color:'#0a8a3c'}
];
function detectClubColor(name){
  var norm = (name||'').trim();
  if(!norm) return '';
  for(var i=0;i<CLUB_BRAND_COLORS.length;i++){
    var entry = CLUB_BRAND_COLORS[i];
    for(var j=0;j<entry.match.length;j++){
      if(norm.indexOf(entry.match[j])!==-1) return entry.color;
    }
  }
  return '';
}
function applyClubTheme(club){
  var color = club && club.color ? club.color : '';
  var meta = document.getElementById('themeColorMeta');

    document.documentElement.style.setProperty('--accent', color);
    if(meta) meta.content = color;
  } else {
    document.documentElement.style.removeProperty('--accent');
    if(meta) meta.content = DEFAULT_ACCENT;
  }
}

// Reuses the exact same phone formatting convention as the phone-OTP login (line ~858):
// local numbers get a +972 prefix with the leading 0 stripped; already-international numbers pass through.
function formatPhoneIL(phone){
  phone = (phone||'').trim();
  if(!phone) return '';
  return phone.charAt(0)==='+' ? phone : ('+972'+phone.replace(/^0/,''));
}

  return '<div class="muted" style="margin-top:10px">הזמנות בהמתנה (יתממשו כשהמאמן יתחבר עם הטלפון הזה)</div>'+
    invites.map(function(inv){
      return '<div class="row" style="margin-top:4px"><span>'+inv.phone+'</span>'+
        '<button class="logout-btn" data-cancelinvite="'+inv.phone+'" title="בטל">🗑</button></div>';
    }).join('');
}
// Invite a coach by phone number: reuses the SAME phone->uid resolution mechanism as login
// (db.collection(P+'coaches') is keyed by the Firebase Auth uid, with a stored phone field set
// at profile-save time / from result.user.phoneNumber). If a coach record with that phone already
// exists, add them to coaches[]/memberInfo immediately (same as joinClubByCode). Otherwise store a
// pendingInvites entry that gets resolved on that phone's next login (see resolvePendingInvitesForMe()).
function inviteCoachByPhone(rawPhone){
  if(!MY_CLUB || ME.role!=='manager') return;
  var phone = formatPhoneIL(rawPhone);
  if(!phone) return;
  var clubRef = db.collection(P+'clubs').doc(ME.uid);
  db.collection(P+'coaches').where('phone','==',phone).get().then(function(snap){
    var fv = (firebase.firestore && firebase.firestore.FieldValue) ? firebase.firestore.FieldValue : null;
    if(!snap.empty){
      var coachDoc = snap.docs[0];
      var uid = coachDoc.id;
      if(fv && fv.arrayUnion){
        clubRef.update({coaches: fv.arrayUnion(uid)});
      } else {
        var coaches = (MY_CLUB.coaches || []).slice();
        if(coaches.indexOf(uid)===-1) coaches.push(uid);
        clubRef.set({coaches:coaches}, {merge:true});
      }
      coachDoc.ref.set({clubId:ME.uid}, {merge:true});
      if(MY_CLUB.coaches && MY_CLUB.coaches.indexOf(uid)===-1) MY_CLUB.coaches.push(uid);
      alert('המאמן הוזמן והצטרף למועדון');
      MY_CLUB_LOADED = false;
      loadMyClub();
      renderTab(3);
    } else {
      var invites = (MY_CLUB.pendingInvites || []).filter(function(inv){ return inv.phone!==phone; });
      invites.push({phone:phone, addedAt: Date.now()});
      clubRef.set({pendingInvites:invites}, {merge:true}).then(function(){
        MY_CLUB.pendingInvites = invites;
        alert('הוזמן בהצלחה — ההזמנה תתממש כאשר המאמן יתחבר לראשונה עם הטלפון הזה');
        renderTab(3);
      });
    }
  });
}
function cancelPendingInvite(phone){
  if(!MY_CLUB || ME.role!=='manager') return;
  var invites = (MY_CLUB.pendingInvites || []).filter(function(inv){ return inv.phone!==phone; });
  MY_CLUB.pendingInvites = invites;
  db.collection(P+'clubs').doc(ME.uid).set({pendingInvites:invites}, {merge:true}).then(function(){
    renderTab(3);
  });
}
// Called once ME.uid/ME.phone are known on login (real phone-OTP flow), BEFORE enterApp().
// Scans every club's pendingInvites for a matching phone and auto-joins that club, mirroring
// joinClubByCode's coaches[]/clubId wiring. Removes the resolved entry from pendingInvites.
// No-op when ME.phone is empty (e.g. LOGIN_DISABLED local mode, which has no real phone number).
function resolvePendingInvitesForMe(cb){
  if(!ME.phone || !ME.uid){ if(cb) cb(); return; }
  db.collection(P+'clubs').get().then(function(snap){
    var matchDoc = null, matchClubId = null;
    snap.forEach(function(doc){
      var data = doc.data();
      if(matchDoc) return;
      var invites = data.pendingInvites || [];
      if(invites.some(function(inv){ return inv.phone===ME.phone; })){
        matchDoc = doc; matchClubId = doc.id;
      }
    });
    if(!matchDoc){ if(cb) cb(); return; }
    var data = matchDoc.data();
    var remainingInvites = (data.pendingInvites||[]).filter(function(inv){ return inv.phone!==ME.phone; });
    var fv = (firebase.firestore && firebase.firestore.FieldValue) ? firebase.firestore.FieldValue : null;
    var clubRef = matchDoc.ref;
    var updates = {pendingInvites: remainingInvites};
    if(fv && fv.arrayUnion){
      clubRef.update(updates);
      clubRef.update({coaches: fv.arrayUnion(ME.uid)});
    } else {
      var coaches = (data.coaches || []).slice();
      if(coaches.indexOf(ME.uid)===-1) coaches.push(ME.uid);
      updates.coaches = coaches;
      clubRef.set(updates, {merge:true});
    }
    ME.clubId = matchClubId;
    db.collection(P+'coaches').doc(ME.uid).set({clubId:matchClubId}, {merge:true}).then(function(){
      if(cb) cb();
    });
  }).catch(function(err){
    console.error('resolvePendingInvitesForMe failed', err);
    if(cb) cb();
  });
}

function clubAdminTeamRows(){

    if(a.type==='punch') alertsByCat[a.category].punch++;
    else if(a.type==='medical') alertsByCat[a.category].medical++;
  });
  var rows = [];
  AGE_GROUPS.forEach(function(cat){
    var t = CLUB_TEAMS[cat];
    if(!t || !t.players || !t.players.length) return;
    var a = alertsByCat[cat] || {punch:0, medical:0};
    rows.push({
      category: cat,
      playersCount: t.players.length,
      coachName: getTeamCoachName(cat) || '—',
      lowPunchCount: a.punch,
      medicalCount: a.medical
    });
  });
  return rows;

function clubAdminCoachRows(rows){
  // best-effort association of teams/players per coach name, via getTeamCoachName matching

  var list = [];
  for(var k in byCoach) list.push(byCoach[k]);
  return list;
}

/* ---------------- Team training plans (read-only, club-owner oversight) ----------------
   Training plans remain strictly coachUid-scoped storage (per the hard requirement); this view
   only ADDS a read-only fan-out query across every coach uid in the club, batched into chunks of
   10 (Firestore 'in' query limit), grouped by coach name. No edit/delete handlers are wired here.
   Restricted to the club OWNER only: plan documents carry no category field, so there is no clean
   linkage to a canManageStaff manager's effectiveCategories. Exposing this to scoped managers would
   risk leaking other coaches' plans outside their assigned categories, so it is intentionally
   owner-only for now. */
function chunkArray(arr, size){
  var out = [];
  for(var i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
function teamPlansViewHtml(plansByCoach, coachOrder){

        var name = CLUB_COACH_NAMES[uid] || uid;
        var plans = plansByCoach[uid] || [];
        var plansHtml = plans.length===0
          ? '<div class="muted" style="font-size:12px;margin-top:4px">אין תוכניות</div>'
          : plans.map(function(p){
              return '<div class="card" style="margin-top:6px"><b>'+p.name+'</b>'+
                '<div class="muted" style="margin-top:4px">'+(p.drills?p.drills.length:0)+' תרגילים</div>'+
              '</div>';
            }).join('');
        return '<div class="card"><div class="row"><b>👨‍🏫 '+name+'</b><span class="muted">'+plans.length+' תוכניות</span></div>'+plansHtml+'</div>';
      }).join('');
  return '<h3 style="margin-bottom:14px">📋 תוכניות אימון של הצוות</h3>'+body;
}
function openTeamPlansView(){
  if(!MY_CLUB || ME.uid!==MY_CLUB.adminUid) return; // owner-only (see note above)
  var uids = (MY_CLUB.coaches || []).slice();
  if(uids.indexOf(ME.uid)===-1) uids.push(ME.uid);
  if(uids.length===0){
    openModal(teamPlansViewHtml({}, []));
    return;
  }
  openModal('<div class="muted" style="text-align:center">טוען תוכניות...</div>');
  var chunks = chunkArray(uids, 10);
  Promise.all(chunks.map(function(chunk){
    return db.collection(P+'trainingplans').where('coachUid','in',chunk).get();
  })).then(function(snaps){
    var plansByCoach = {};
    var coachOrder = uids.slice();
    snaps.forEach(function(snap){

/* ---------------- Pitch board (toolbox-based tactics editor) ---------------- */
var BASE_W = 600, BASE_H = 380;
var boardState = {elements:[], orientation:'h', view:'top', bgStyle:'classic'};
var boardHistory = [];
var addMode = null;
var pendingPlayerColor = '#1c2230';
var lineStart = null;
var selectedElId = null;
var editingPlan = null;
var editingDrills = [];
var editingDrillIndex = null;
var PLAYBACK_SPEED = 1;
var playState = {playing:false, timer:null, interval:null};

var PLAYER_COLORS = ['#1c2230','#e63946','#2a9d8f','#f4a300','#3b82f6','#ffffff'];
var TOOLBOX_ITEMS = [
  {type:'player', ic:'🧍', label:'שחקן'},
  {type:'gk', ic:'🧤', label:'שוער'},
  {type:'goal', ic:'🥅', label:'שער'},
  {type:'cone', ic:'🔺', label:'קונוס'},
  {type:'ball', ic:'⚽', label:'כדור'},
  {type:'arrow', ic:'➡️', label:'חץ'},
  {type:'line', ic:'➖', label:'קו'}
];
var POINT_TYPES = ['player','gk','goal','cone','ball'];
var LINE_TYPES = ['arrow','line'];

function pitchDims(orientation){
  return orientation==='v' ? {w:BASE_H, h:BASE_W} : {w:BASE_W, h:BASE_H};
}
function dispXY(x, y, orientation){
  return orientation==='v' ? {x:y, y:x} : {x:x, y:y};
}
function canonXY(x, y, orientation){
  return orientation==='v' ? {x:y, y:x} : {x:x, y:y};
}
function shapeMarkup(el, small){
  var sc = small ? 1 : (el.scale||1);
  if(el.type==='player' || el.type==='gk'){
    var color = el.type==='gk' ? '#f4c400' : el.color;
    if(small){
      return '<circle r="4" fill="'+color+'" stroke="#fff" stroke-width="0.5"/>';
    }
    var txtFill = color==='#ffffff' || color==='#f4c400' ? '#1c2230' : '#fff';
    var bw = 12*sc, bh = 14*sc, sw = 5.5*sc, sh = 6.5*sc;
    var sleeveL = '<rect x="'+(-bw/2-sw*0.7)+'" y="'+(-bh/2+1*sc)+'" width="'+(sw*0.8)+'" height="'+sh+'" rx="'+(1.2*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="0.8"/>';
    var sleeveR = '<rect x="'+(bw/2-sw*0.1)+'" y="'+(-bh/2+1*sc)+'" width="'+(sw*0.8)+'" height="'+sh+'" rx="'+(1.2*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="0.8"/>';
    var body = '<rect x="'+(-bw/2)+'" y="'+(-bh/2+1.5*sc)+'" width="'+bw+'" height="'+bh+'" rx="'+(2.5*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="1"/>';
    var collar = '<path d="M'+(-2.4*sc)+','+(-bh/2+2*sc)+' L0,'+(-bh/2+4.6*sc)+' L'+(2.4*sc)+','+(-bh/2+2*sc)+'" fill="none" stroke="#fff" stroke-width="0.9"/>';
    var num = '<text x="0" y="'+(3.5*sc)+'" text-anchor="middle" font-size="'+(9*sc)+'" font-weight="bold" fill="'+txtFill+'">'+(el.num||'')+'</text>';
    var legs = '<path d="M'+(-3*sc)+','+(bh/2+1.5*sc)+' L'+(-3.5*sc)+','+(bh/2+5*sc)+' M'+(3*sc)+','+(bh/2+1.5*sc)+' L'+(3.5*sc)+','+(bh/2+5*sc)+'" fill="none" stroke="#3b2a1a" stroke-width="'+(2.2*sc)+'" stroke-linecap="round"/>';
    var head = '<circle cx="0" cy="'+(-bh/2-2.6*sc)+'" r="'+(2.6*sc)+'" fill="#e3ad7c" stroke="#3b2a1a" stroke-width="0.5"/>';
    return legs + sleeveL + sleeveR + body + collar + head + num;
  }
  if(el.type==='ball'){
    var r = (small?3:10)*sc;
    if(small){ return '<circle r="'+r+'" fill="#fff" stroke="#1c2230" stroke-width="0.5"/>'; }
    var pent = '';
    for(var i=0;i<5;i++){
      var ang = -Math.PI/2 + i*2*Math.PI/5;
      pent += (i===0?'M':'L')+(r*0.42*Math.cos(ang))+','+(r*0.42*Math.sin(ang))+' ';
    }
    pent += 'Z';
    var spokes = '';
    for(var k=0;k<5;k++){
      var a2 = -Math.PI/2 + k*2*Math.PI/5;
      spokes += '<line x1="'+(r*0.42*Math.cos(a2))+'" y1="'+(r*0.42*Math.sin(a2))+'" x2="'+(r*0.92*Math.cos(a2))+'" y2="'+(r*0.92*Math.sin(a2))+'" stroke="#1c2230" stroke-width="0.8"/>';
    }
    return '<circle r="'+r+'" fill="#fff" stroke="#1c2230" stroke-width="1"/>'+
      '<path d="'+pent+'" fill="#1c2230"/>'+spokes;
  }
  if(el.type==='goal'){
    var gw = (small?8:22)*sc, gh = (small?5:14)*sc;
    if(small){ return '<rect x="'+(-gw/2)+'" y="'+(-gh/2)+'" width="'+gw+'" height="'+gh+'" fill="none" stroke="#fff" stroke-width="1"/>'; }
    var net = '';
    var cols = 4, rows = 3;
    for(var c=1;c<cols;c++){
      var nx = -gw/2 + (gw/cols)*c;
      net += '<line x1="'+nx+'" y1="'+(-gh/2)+'" x2="'+nx+'" y2="'+(gh/2)+'" stroke="#fff" stroke-width="0.6" opacity="0.65"/>';
    }
    for(var rI=1;rI<rows;rI++){
      var ny = -gh/2 + (gh/rows)*rI;
      net += '<line x1="'+(-gw/2)+'" y1="'+ny+'" x2="'+(gw/2)+'" y2="'+ny+'" stroke="#fff" stroke-width="0.6" opacity="0.65"/>';
    }
    return '<rect x="'+(-gw/2)+'" y="'+(-gh/2)+'" width="'+gw+'" height="'+gh+'" fill="#1c2230" opacity="0.18" stroke="#fff" stroke-width="2.2"/>'+net;
  }
  if(el.type==='cone'){
    var s = (small?5:10)*sc;
    return '<path d="M0,-'+s+' L'+s+','+s+' L-'+s+','+s+' Z" fill="#f4731c" stroke="#fff" stroke-width="'+(small?0.5:1.5)+'"/>';
  }
  return '';
}
function selHighlight(el){
  var s = (el.type==='player'?15:12)*(el.scale||1);
  return '<rect x="-'+s+'" y="-'+s+'" width="'+(s*2)+'" height="'+(s*2)+'" fill="none" stroke="#fff200" stroke-width="2"/>';
}
var BG_STYLES = {
  classic: {a:'#3eac46', b:'#369b3d'},
  dark: {a:'#1f5c2a', b:'#1a4f24'},
  light: {a:'#6fc977', b:'#62b86a'},
  blue: {a:'#2e6fb0', b:'#27619c'}
};
function pitchSvgMarkup(elements, small, orientation, svgId, bgStyle){
  var dims = small ? {w:60,h:40} : pitchDims(orientation);
  var w = dims.w, h = dims.h;
  var sx = small ? 60/BASE_W : 1, sy = small ? 40/BASE_H : 1;
  var sw = small ? 1 : 2;
  var portrait = !small && orientation==='v';
  var boxDepth = portrait ? h*0.16 : w*0.16, boxH = portrait ? w*0.6 : h*0.6;
  var gaDepth = portrait ? h*0.06 : w*0.06, gaH = portrait ? w*0.3 : h*0.3;
  var bg = BG_STYLES[bgStyle] || BG_STYLES.classic;
  var stripes = '';
  var stripeCount = small ? 6 : 12;
  var stripeW = portrait ? h/stripeCount : w/stripeCount;
  for(var si=0; si<stripeCount; si++){
    stripes += portrait ?
      ('<rect x="0" y="'+(si*stripeW)+'" width="'+w+'" height="'+stripeW+'" fill="'+(si%2===0?bg.a:bg.b)+'"/>') :
      ('<rect x="'+(si*stripeW)+'" y="0" width="'+stripeW+'" height="'+h+'" fill="'+(si%2===0?bg.a:bg.b)+'"/>');
  }
  var lines = stripes+'<rect x="2" y="2" width="'+(w-4)+'" height="'+(h-4)+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
    (portrait ?
      ('<line x1="2" y1="'+(h/2)+'" x2="'+(w-2)+'" y2="'+(h/2)+'" stroke="#fff" stroke-width="'+sw+'"/>') :
      ('<line x1="'+(w/2)+'" y1="2" x2="'+(w/2)+'" y2="'+(h-2)+'" stroke="#fff" stroke-width="'+sw+'"/>')
    )+
    '<circle cx="'+(w/2)+'" cy="'+(h/2)+'" r="'+(small?6:40)+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
    (portrait ?
      ('<rect x="'+((w-boxH)/2)+'" y="2" width="'+boxH+'" height="'+boxDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-boxH)/2)+'" y="'+(h-2-boxDepth)+'" width="'+boxH+'" height="'+boxDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-gaH)/2)+'" y="2" width="'+gaH+'" height="'+gaDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-gaH)/2)+'" y="'+(h-2-gaDepth)+'" width="'+gaH+'" height="'+gaDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>') :
      ('<rect x="2" y="'+((h-boxH)/2)+'" width="'+boxDepth+'" height="'+boxH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+(w-2-boxDepth)+'" y="'+((h-boxH)/2)+'" width="'+boxDepth+'" height="'+boxH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="2" y="'+((h-gaH)/2)+'" width="'+gaDepth+'" height="'+gaH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+(w-2-gaDepth)+'" y="'+((h-gaH)/2)+'" width="'+gaDepth+'" height="'+gaH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>')
    );
  var linesHtml = elements.filter(function(el){ return LINE_TYPES.indexOf(el.type)>=0; }).map(function(el){
    var p1 = small ? {x:el.x1, y:el.y1} : dispXY(el.x1, el.y1, orientation);
    var p2 = small ? {x:el.x2, y:el.y2} : dispXY(el.x2, el.y2, orientation);
    var marker = el.type==='arrow' ? ' marker-end="url(#arrowhead)"' : '';
    var dash = el.type==='line' ? ' stroke-dasharray="5,4"' : '';
    return '<line x1="'+(p1.x*sx)+'" y1="'+(p1.y*sy)+'" x2="'+(p2.x*sx)+'" y2="'+(p2.y*sy)+'" stroke="#fff200" stroke-width="'+(small?1.5:3)+'"'+marker+dash+'/>';
  }).join('');
  var pointsHtml = elements.filter(function(el){ return POINT_TYPES.indexOf(el.type)>=0; }).map(function(el){
    var p = small ? {x:el.x, y:el.y} : dispXY(el.x, el.y, orientation);
    var dx = p.x*sx, dy = p.y*sy;
    var sel = (!small && el.id===selectedElId) ? selHighlight(el) : '';
    return '<g class="elem-token" data-id="'+el.id+'" data-type="'+el.type+'" transform="translate('+dx+','+dy+')" style="cursor:'+(small?'default':'grab')+'">'+sel+shapeMarkup(el, small)+'</g>';
  }).join('');
  return '<svg id="'+(svgId||'pitchSvg')+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fff200"/></marker></defs>'+
    lines + linesHtml + pointsHtml +
  '</svg>';
}

function saveCurrentFrame(){
  var frame = {
    elements: boardState.elements.map(function(e){
      var c = {id:e.id, type:e.type};
      if(POINT_TYPES.indexOf(e.type)>=0){ c.x=e.x; c.y=e.y; c.scale=e.scale||1; if(e.type==='player'){ c.color=e.color; c.num=e.num; } else if(e.type==='gk'){ c.num=e.num; } }
      else { c.x1=e.x1; c.y1=e.y1; c.x2=e.x2; c.y2=e.y2; }
      return c;
    }),
    note: (document.getElementById('drillNoteInput').value||'').trim()
  };
  if(editingDrillIndex!==null){

    editingDrills.push(frame);
    editingDrillIndex = editingDrills.length-1;
  }

function nextPlayerNum(){

function renderPlanBuilderModal(){
  var frameLabel = editingDrillIndex!==null ? ('פריים '+(editingDrillIndex+1)+' מתוך '+editingDrills.length) : ('פריים חדש #'+(editingDrills.length+1));
  var body = ''+

  '<div class="pitch-stage">'+
    '<div class="pitch-wrap">'+pitchSvgMarkup(boardState.elements, false, boardState.orientation, 'pitchSvg', boardState.bgStyle)+'</div>'+
  '</div>'+
  '<div class="tool-strip">'+
    TOOLBOX_ITEMS.map(function(item){
      return '<button class="tbx-btn '+(addMode===item.type?'sel':'')+'" data-tool="'+item.type+'">'+item.ic+'<span>'+item.label+'</span></button>';
    }).join('')+
  '</div>'+
  (addMode==='player'
    ? '<div class="color-row">'+PLAYER_COLORS.map(function(c){
        return '<button class="color-sw '+(pendingPlayerColor===c?'sel':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';

function animateFrameTransition(area, fromEls, toEls, onDone, speed){
  area.innerHTML = pitchSvgMarkup(toEls, false, 'h', 'playSvg', boardState.bgStyle);
  var fromById = {};
  fromEls.forEach(function(e){ if(POINT_TYPES.indexOf(e.type)>=0) fromById[e.id] = e; });
  var moves = [];
  toEls.forEach(function(e){
    if(POINT_TYPES.indexOf(e.type)<0) return;
    var prev = fromById[e.id];
    if(!prev) return;
    if(prev.x===e.x && prev.y===e.y) return;
    var token = area.querySelector('[data-id="'+e.id+'"]');
    if(!token) return;
    var p1 = dispXY(prev.x, prev.y, 'h');
    var p2 = dispXY(e.x, e.y, 'h');
    moves.push({token:token, x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y});
  });
  if(moves.length===0){ playState.timer = setTimeout(onDone, 700/speed); return; }
  var svgEl = area.querySelector('svg');
  if(svgEl){
    moves.forEach(function(m){
      var trail = document.createElementNS('http://www.w3.org/2000/svg','line');
      trail.setAttribute('x1', m.x1); trail.setAttribute('y1', m.y1);
      trail.setAttribute('x2', m.x2); trail.setAttribute('y2', m.y2);
      trail.setAttribute('stroke', '#fff200'); trail.setAttribute('stroke-width', '2');
      trail.setAttribute('stroke-dasharray', '4,4');
      trail.setAttribute('marker-end', 'url(#arrowhead)');
      trail.setAttribute('opacity', '0.85');
      svgEl.insertBefore(trail, m.token.parentNode===svgEl ? m.token : null);
    });
  }
  var steps = 24, dur = 900/speed, step = 0;
  moves.forEach(function(m){ m.token.setAttribute('transform','translate('+m.x1+','+m.y1+')'); });
  var iv = setInterval(function(){
    if(!playState.playing){ clearInterval(iv); return; }
    step++;
    var t = step/steps;
    if(t>1) t = 1;
    var ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
    moves.forEach(function(m){
      var x = m.x1 + (m.x2-m.x1)*ease;
      var y = m.y1 + (m.y2-m.y1)*ease;
      m.token.setAttribute('transform','translate('+x+','+y+')');
    });
    if(step>=steps){
      clearInterval(iv);
      playState.interval = null;
      playState.timer = setTimeout(onDone, 400/speed);
    }
  }, dur/steps);
  playState.interval = iv;
}
function playDrills(){
  stopPlayback();
  var area = document.getElementById('drillPlayArea');
  if(!area || editingDrills.length===0) return;
  playState.playing = true;
  area.innerHTML = pitchSvgMarkup(editingDrills[0].elements, false, 'h', 'playSvg', boardState.bgStyle);
  var i = 0;
  function nextFrame(){
    if(!playState.playing) return;
    if(i>=editingDrills.length-1){ playState.playing = false; return; }
    var from = editingDrills[i].elements, to = editingDrills[i+1].elements;
    i++;
    animateFrameTransition(area, from, to, nextFrame, getPlaybackSpeed());
  }
  playState.timer = setTimeout(nextFrame, 700/getPlaybackSpeed());
}
function svgPoint(svg, evt){
  var rect = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  var touch = (evt.changedTouches && evt.changedTouches[0]) || (evt.touches && evt.touches[0]);
  var clientX = touch ? touch.clientX : evt.clientX;
  var clientY = touch ? touch.clientY : evt.clientY;
  var x = (clientX - rect.left) / rect.width * vb.width;
  var y = (clientY - rect.top) / rect.height * vb.height;
  return {x:x, y:y};
}
var pitchDragging = null;
var pitchTapHandled = false;
function handlePitchTap(svg, evt){
  if(pitchDragging) return;
  if(evt.target && evt.target.closest && evt.target.closest('.elem-token')) return;
  if(!addMode) return;
  var pt = svgPoint(svg, evt);
  var canon = canonXY(pt.x, pt.y, boardState.orientation);
  if(POINT_TYPES.indexOf(addMode)>=0){
    pushHistory();
    var el = {id:genCode(6), type:addMode, x:canon.x, y:canon.y, scale:1};
    if(addMode==='player'){ el.color = pendingPlayerColor; el.num = nextPlayerNum(); }
    if(addMode==='gk'){ el.num = 'GK'; }
    boardState.elements.push(el);
    renderPlanBuilderModal();
  } else {
    if(!lineStart){
      lineStart = canon;
    } else {
      pushHistory();
      boardState.elements.push({id:genCode(6), type:addMode, x1:lineStart.x, y1:lineStart.y, x2:canon.x, y2:canon.y});
      lineStart = null;
      renderPlanBuilderModal();
    }
  }
}
function touchDist(touches){
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
function wirePitchSvg(){
  var svg = document.getElementById('pitchSvg');
  if(!svg) return;
  document.querySelectorAll('.elem-token').forEach(function(token){
    token.addEventListener('mousedown', function(e){ startDrag(token); e.stopPropagation(); });
    token.addEventListener('touchstart', function(e){
      var id = token.dataset.id;
      if(e.touches.length>=2){
        e.preventDefault();
        var el = boardState.elements.filter(function(x){return x.id===id;})[0];
        if(el && POINT_TYPES.indexOf(el.type)>=0){
          selectedElId = id;
          pitchDragging = null;
          pinchState = {id:id, initialDist:touchDist(e.touches), initialScale: el.scale||1};
        }
      } else {
        startDrag(token);
      }
      e.stopPropagation();
    }, {passive:false});
  });
  svg.addEventListener('click', function(e){
    if(pitchTapHandled){ pitchTapHandled = false; return; }
    handlePitchTap(svg, e);
  });
  svg.addEventListener('touchend', function(e){
    pitchTapHandled = true;
    e.preventDefault();
    handlePitchTap(svg, e);
  });
}
function startDrag(token){
  if(addMode) return;
  var id = token.dataset.id;
  selectedElId = id;
  pitchDragging = boardState.elements.filter(function(e){return e.id===id;})[0];
  if(pitchDragging) pushHistory();
}
function resizeSelected(delta){
  if(!selectedElId) return;
  var el = boardState.elements.filter(function(e){return e.id===selectedElId;})[0];
  if(!el || POINT_TYPES.indexOf(el.type)<0) return;
  pushHistory();
  el.scale = Math.max(0.5, Math.min(2.5, (el.scale||1)+delta));
  renderPlanBuilderModal();
}
var pinchState = null;
document.addEventListener('mousemove', onPitchDragMove);
document.addEventListener('touchmove', onPitchDragMove, {passive:false});
document.addEventListener('touchmove', onPitchPinchMove, {passive:false});
document.addEventListener('mouseup', onPitchDragEnd);
document.addEventListener('touchend', onPitchDragEnd);
document.addEventListener('touchend', onPitchPinchEnd);
function onPitchDragMove(e){
  if(!pitchDragging) return;
  var svg = document.getElementById('pitchSvg');
  if(!svg) return;
  e.preventDefault();
  var pt = svgPoint(svg, e);
  var dims = pitchDims(boardState.orientation);
  var dx = Math.max(10,Math.min(dims.w-10,pt.x));
  var dy = Math.max(10,Math.min(dims.h-10,pt.y));
  var canon = canonXY(dx, dy, boardState.orientation);
  pitchDragging.x = canon.x;
  pitchDragging.y = canon.y;
  var g = svg.querySelector('.elem-token[data-id="'+pitchDragging.id+'"]');
  if(g){ g.setAttribute('transform', 'translate('+dx+','+dy+')'); }
}
function onPitchDragEnd(){
  if(pitchDragging){ pitchDragging = null; renderPlanBuilderModal(); }
}
function onPitchPinchMove(e){
  if(!pinchState || e.touches.length<2) return;
  e.preventDefault();
  var el = boardState.elements.filter(function(x){return x.id===pinchState.id;})[0];
  if(!el) return;
  var d = touchDist(e.touches);
  el.scale = Math.max(0.5, Math.min(2.5, pinchState.initialScale * (d / pinchState.initialDist)));
  var svg = document.getElementById('pitchSvg');
  var g = svg && svg.querySelector('.elem-token[data-id="'+el.id+'"]');
  if(g){
    var sel = el.id===selectedElId ? selHighlight(el) : '';
    g.innerHTML = sel + shapeMarkup(el, false);
  }
}
function onPitchPinchEnd(e){
  if(pinchState && e.touches.length<2){
    pinchState = null;
    renderPlanBuilderModal();
  }
}
function genCode(len){
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '';
  for(var i=0;i<len;i++) s += chars.charAt(Math.floor(Math.random()*chars.length));
  return s;
}

/* ---------------- Share via WhatsApp / Email ---------------- */
function cleanPhoneForWa(phone){
  if(!phone) return '';
  var digits = (''+phone).replace(/\D/g,'');
  if(!digits) return '';
  if(digits.charAt(0)==='0') digits = '972'+digits.substring(1);
  else if(digits.indexOf('972')!==0 && digits.length<=10) digits = '972'+digits;
  return digits;
}
function planTextSummary(plan){
  var lines = [];
  lines.push('תוכנית אימון — '+(plan.name||'ללא שם'));
  var phases = plan.phases || [];
  if(phases.length){
    lines.push('');
    lines.push('שלבי האימון:');
    phases.forEach(function(ph){
      lines.push('• '+ph.name);
      (ph.items||[]).forEach(function(it){
        lines.push('   - '+it.title+(it.duration_min?' ('+it.duration_min+' דק׳)':'')+(it.notes?' — '+it.notes:''));
      });
    });
  }
  var weeks = plan.weeks || [];
  if(weeks.length){
    lines.push('');
    lines.push('שלבי עונה:');
    weeks.forEach(function(w){
      var statusT = w.status==='done' ? 'הושלם' : (w.status==='open' ? 'פתוח' : 'נעול');
      lines.push('• '+w.label+' ('+statusT+')'+(w.notes?' — '+w.notes:''));
    });
  }
  return lines.join('\n');
}
function playerReportSummaryText(player, category){
  var p = player;
  var lines = [];
  lines.push('דוח שחקן — '+p.name);
  if(category) lines.push('קבוצה: '+category);
  var stats = countPlayerAttendance(p.name);
  lines.push('נוכחות: '+stats.present+' אימונים'+(stats.maxStreak?' · רצף מקסימלי '+stats.maxStreak:''));
  lines.push('מדדים פיזיים: '+PHYSICAL_ATTRS.map(function(a){ return a.l+' '+((typeof p[a.k]==='number')?p[a.k]:0)+'/5'; }).join(' · '));
  return lines.join('\n');
}
function openShareModal(title, text, phone, email){
  var waUrl = phone ? ('https://wa.me/'+phone+'?text='+encodeURIComponent(text)) : ('https://wa.me/?text='+encodeURIComponent(text));
  var mailUrl = 'mailto:'+(email||'')+'?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(text);
  var html = '<h3 style="margin-bottom:14px">📤 שיתוף</h3>'+
    '<div class="muted" style="margin-bottom:14px;white-space:pre-wrap;max-height:200px;overflow:auto;font-size:12px">'+text.replace(/</g,'&lt;')+'</div>'+
    '<div class="grid2" style="margin-bottom:8px">'+
      '<button class="btn ghost" id="shareWaBtn">📲 שלח ב-WhatsApp</button>'+
      '<button class="btn ghost" id="shareMailBtn">✉️ שלח באימייל</button>'+
    '</div>';
  openModal(html);
  document.getElementById('shareWaBtn').onclick = function(){ window.open(waUrl, '_blank'); };
  document.getElementById('shareMailBtn').onclick = function(){ window.location.href = mailUrl; };
}
function sharePlan(){
  var text = planTextSummary(editingPlan);
  openShareModal(editingPlan.name||'תוכנית אימון', text, '', '');
}
function sharePlayerReport(player, category){
  var text = playerReportSummaryText(player, category);
  var phone = cleanPhoneForWa(player.parent_phone);
  openShareModal('דוח שחקן — '+player.name, text, phone, player.parent_email||'');
}

/* ---------------- Monthly printable PDF report + archive ---------------- */
var HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function currentMonthLabel(){
  var d = new Date();
  return HEB_MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function todayLabel(){
  var d = new Date();
  return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
}
function attendancePctForPlayer(player){
  var stats = countPlayerAttendance(player.name);
  var pct = stats.total>0 ? Math.round((stats.present/stats.total)*100) : 0;
  return {pct:pct, present:stats.present, total:stats.total, maxStreak:stats.maxStreak};
}
function reportPageHtml(rec){
  var clubName = (typeof MY_CLUB!=='undefined' && MY_CLUB && MY_CLUB.name) ? MY_CLUB.name : 'מועדון כדורגל';
  var accent = (typeof MY_CLUB!=='undefined' && MY_CLUB && MY_CLUB.color) ? MY_CLUB.color : DEFAULT_ACCENT;
  var photoHtml = rec.photo
    ? '<img src="'+rec.photo+'">'
    : '<div class="ph-fallback">👤</div>';
  return '<div class="report-page" style="border-right:4px solid '+accent+'">'+
    '<div class="report-header">'+photoHtml+
      '<div>'+
        '<div class="report-title">'+rec.playerName+'</div>'+
        '<div class="report-sub">'+clubName+(rec.category?' · '+rec.category:'')+'</div>'+
        '<div class="report-sub">דוח חודשי — '+rec.month_label+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="report-section">'+
      '<div class="st">נוכחות החודש</div>'+
      '<div class="report-row"><span>אחוז נוכחות</span><b>'+rec.attendance_pct+'%</b></div>'+
    '</div>'+
    (rec.physical_html ? '<div class="report-section"><div class="st">מדדים פיזיים</div>'+rec.physical_html+'</div>' : '')+
    (rec.badges_html ? '<div class="report-section"><div class="st">תגים והישגים</div>'+rec.badges_html+'</div>' : '')+
    '<div class="report-section">'+
      '<div class="st">הערות מאמן</div>'+
      '<div class="report-feedback">'+(rec.coach_feedback ? rec.coach_feedback.replace(/</g,'&lt;') : '— ללא הערות —')+'</div>'+
    '</div>'+
    '<div class="muted" style="font-size:11px;text-align:center;margin-top:10px">הופק בתאריך '+(rec.created_at_label||todayLabel())+'</div>'+
  '</div>';
}
var currentReportRecord = null;
function openMonthlyReportFeedbackModal(player, category){
  var html = '<h3 style="margin-bottom:14px">📄 דוח חודשי — '+player.name+'</h3>'+
    '<div class="muted" style="margin-bottom:10px">הוסף הערות מאמן (אופציונלי) לפני יצירת הדוח עבור '+currentMonthLabel()+'</div>'+
    '<div class="field"><label>הערות מאמן</label><textarea id="reportFeedbackInput" rows="4" placeholder="התרשמות, נקודות לשיפור, עידוד..."></textarea></div>'+
    '<button class="btn" id="btnBuildReport">צור דוח</button>';
  openModal(html);
  document.getElementById('btnBuildReport').onclick = function(){
    var feedback = document.getElementById('reportFeedbackInput').value.trim();
    closeModal();
    openPlayerReportScreen(player, category, feedback);
  };
}
function buildReportRecord(player, category, feedback){
  var attStats = attendancePctForPlayer(player);
  return {
    id: genCode(10),
    coachUid: ME.uid,
    playerName: player.name,
    category: category||'',
    photo: player.photo||'',
    month_label: currentMonthLabel(),
    attendance_pct: attStats.pct,
    coach_feedback: feedback||'',
    created_at_label: todayLabel(),
    physical_html: playerPhysicalBarsHtml(player),
    badges_html: playerBadgeRowHtml(player)
  };
}
function openPlayerReportScreen(player, category, feedback){
  currentReportRecord = buildReportRecord(player, category, feedback);
  renderPlayerReportScreen();
  document.getElementById('playerReportScreen').style.display = 'flex';
}
function renderPlayerReportScreen(){
  var rec = currentReportRecord;
  var body = document.getElementById('playerReportBody');
  body.innerHTML =
    '<div class="action-row no-print" style="margin-bottom:14px">'+
      '<button class="btn ghost" id="btnPrintReport">🖨 הדפס / שמור כ-PDF</button>'+
      '<button class="btn" id="btnSaveReportArchive">💾 שמור לארכיון</button>'+
    '</div>'+
    reportPageHtml(rec);
  document.getElementById('btnPrintReport').onclick = function(){ window.print(); };
  document.getElementById('btnSaveReportArchive').onclick = function(){ saveReportToArchive(rec); };
}
function closePlayerReportScreen(){
  document.getElementById('playerReportScreen').style.display = 'none';
}
var COACH_REPORTS = [];
var COACH_REPORTS_LOADED = false;
function loadCoachReports(cb){
  if(!ME.uid) return;
  db.collection(P+'reports').where('coachUid','==',ME.uid).get().then(function(snap){
    COACH_REPORTS = snap.docs.map(function(d){ return d.data(); });
    COACH_REPORTS_LOADED = true;
    if(cb) cb();
    var scr = document.getElementById('reportArchiveScreen');
    if(scr && scr.style.display!=='none') renderReportArchiveScreen();
  });
}
function saveReportToArchive(rec){
  db.collection(P+'reports').doc(rec.id).set(rec).then(function(){
    if(COACH_REPORTS_LOADED){
      var idx = COACH_REPORTS.findIndex(function(r){ return r.id===rec.id; });
      if(idx===-1) COACH_REPORTS.push(rec); else COACH_REPORTS[idx] = rec;
    }
    alert('הדוח נשמר בארכיון');
  });
}
function deleteCoachReport(id){
  if(!confirm('למחוק את הדוח מהארכיון?')) return;
  db.collection(P+'reports').doc(id).delete().then(function(){
    COACH_REPORTS = COACH_REPORTS.filter(function(r){ return r.id!==id; });
    renderReportArchiveScreen();
  });
}
function openReportArchive(){
  document.getElementById('reportArchiveScreen').style.display = 'flex';
  if(!COACH_REPORTS_LOADED){
    document.getElementById('reportArchiveBody').innerHTML = '<div class="muted" style="text-align:center">טוען...</div>';
    loadCoachReports(function(){ renderReportArchiveScreen(); });
  } else {
    renderReportArchiveScreen();
  }
}
function closeReportArchive(){
  document.getElementById('reportArchiveScreen').style.display = 'none';
}
function renderReportArchiveScreen(){
  var body = document.getElementById('reportArchiveBody');
  body.innerHTML =
    '<div class="muted" style="margin-bottom:10px">דוחות חודשיים שנשמרו לשחקנים</div>'+
    (COACH_REPORTS.length===0
      ? '<div class="card" style="text-align:center;color:var(--sub)">עדיין לא נשמרו דוחות</div>'
      : COACH_REPORTS.slice().reverse().map(function(r){
          return '<div class="card">'+
            '<div class="row"><b>'+r.playerName+'</b><button class="logout-btn" data-delreport="'+r.id+'" title="מחק">🗑</button></div>'+
            '<div class="muted" style="margin-top:4px">'+r.month_label+' · נוכחות '+r.attendance_pct+'% · '+(r.created_at_label||'')+'</div>'+
            '<button class="btn ghost sm" data-viewreport="'+r.id+'" style="margin-top:8px">פתח דוח</button>'+
          '</div>';
        }).join('')
    );
  document.querySelectorAll('[data-viewreport]').forEach(function(btn){
    btn.onclick = function(){
      var rec = COACH_REPORTS.filter(function(r){ return r.id===btn.dataset.viewreport; })[0];
      if(rec){ currentReportRecord = rec; renderPlayerReportScreen(); document.getElementById('playerReportScreen').style.display = 'flex'; }
    };
  });
  document.querySelectorAll('[data-delreport]').forEach(function(btn){
    btn.onclick = function(){ deleteCoachReport(btn.dataset.delreport); };
  });
}
document.getElementById('btnClosePlayerReport').onclick = function(){ closePlayerReportScreen(); };
document.getElementById('btnCloseReportArchive').onclick = function(){ closeReportArchive(); };

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}
document.getElementById('modalBg').onclick = function(e){
  if(e.target === document.getElementById('modalBg')) closeModal();
};
function goHome(){

document.getElementById('btnCloseTeamScreen').onclick = function(){ closeTeamDetail(); goHome(); };
document.getElementById('btnCloseMatchScreen').onclick = function(){

document.getElementById('btnCloseCoachTrainingLib').onclick = function(){ closeCoachTrainingLib(); };
