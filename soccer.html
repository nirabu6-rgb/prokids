    coach_feedback: feedback||'',
    created_at_label: todayLabel(),
    physical_html: playerPhysicalBarsHtml(player),
    badges_html: playerBadgeRowHtml(player)
  };
}
function openPlayerReportScreen(player, category, feedback){
  currentReportRecord = buildReportRecord(player, category, feedback);
  renderPlayerReportScreen();
  document.getElementById('playerReportScreen').style.display = 'flex';
}
function renderPlayerReportScreen(){
  var rec = currentReportRecord;
  var body = document.getElementById('playerReportBody');
  body.innerHTML =
    '<div class="action-row no-print" style="margin-bottom:14px">'+
      '<button class="btn ghost" id="btnPrintReport">🖨 הדפס / שמור כ-PDF</button>'+
      '<button class="btn" id="btnSaveReportArchive">💾 שמור לארכיון</button>'+
    '</div>'+
    reportPageHtml(rec);
  document.getElementById('btnPrintReport').onclick = function(){ window.print(); };
  document.getElementById('btnSaveReportArchive').onclick = function(){ saveReportToArchive(rec); };
}
function closePlayerReportScreen(){
  document.getElementById('playerReportScreen').style.display = 'none';
}
var COACH_REPORTS = [];
var COACH_REPORTS_LOADED = false;
function loadCoachReports(cb){
  if(!ME.uid) return;
  db.collection(P+'reports').where('coachUid','==',ME.uid).get().then(function(snap){
    COACH_REPORTS = snap.docs.map(function(d){ return d.data(); });
    COACH_REPORTS_LOADED = true;
    if(cb) cb();
    var scr = document.getElementById('reportArchiveScreen');
    if(scr && scr.style.display!=='none') renderReportArchiveScreen();
  });
}
function saveReportToArchive(rec){
  db.collection(P+'reports').doc(rec.id).set(rec).then(function(){
    if(COACH_REPORTS_LOADED){
      var idx = COACH_REPORTS.findIndex(function(r){ return r.id===rec.id; });
      if(idx===-1) COACH_REPORTS.push(rec); else COACH_REPORTS[idx] = rec;
    }
    alert('הדוח נשמר בארכיון');
  });
}
function deleteCoachReport(id){
  if(!confirm('למחוק את הדוח מהארכיון?')) return;
  db.collection(P+'reports').doc(id).delete().then(function(){
    COACH_REPORTS = COACH_REPORTS.filter(function(r){ return r.id!==id; });
    renderReportArchiveScreen();
  });
}
function openReportArchive(){
  document.getElementById('reportArchiveScreen').style.display = 'flex';
  if(!COACH_REPORTS_LOADED){
    document.getElementById('reportArchiveBody').innerHTML = '<div class="muted" style="text-align:center">טוען...</div>';
    loadCoachReports(function(){ renderReportArchiveScreen(); });
  } else {
    renderReportArchiveScreen();
  }
}
function closeReportArchive(){
  document.getElementById('reportArchiveScreen').style.display = 'none';
}
function renderReportArchiveScreen(){
  var body = document.getElementById('reportArchiveBody');
  body.innerHTML =
    '<div class="muted" style="margin-bottom:10px">דוחות חודשיים שנשמרו לשחקנים</div>'+
    (COACH_REPORTS.length===0
      ? '<div class="card" style="text-align:center;color:var(--sub)">עדיין לא נשמרו דוחות</div>'
      : COACH_REPORTS.slice().reverse().map(function(r){
          return '<div class="card">'+
            '<div class="row"><b>'+r.playerName+'</b><button class="logout-btn" data-delreport="'+r.id+'" title="מחק">🗑</button></div>'+
            '<div class="muted" style="margin-top:4px">'+r.month_label+' · נוכחות '+r.attendance_pct+'% · '+(r.created_at_label||'')+'</div>'+
            '<button class="btn ghost sm" data-viewreport="'+r.id+'" style="margin-top:8px">פתח דוח</button>'+
          '</div>';
        }).join('')
    );
  document.querySelectorAll('[data-viewreport]').forEach(function(btn){
    btn.onclick = function(){
      var rec = COACH_REPORTS.filter(function(r){ return r.id===btn.dataset.viewreport; })[0];
      if(rec){ currentReportRecord = rec; renderPlayerReportScreen(); document.getElementById('playerReportScreen').style.display = 'flex'; }
    };
  });
  document.querySelectorAll('[data-delreport]').forEach(function(btn){
    btn.onclick = function(){ deleteCoachReport(btn.dataset.delreport); };
  });
}
document.getElementById('btnClosePlayerReport').onclick = function(){ closePlayerReportScreen(); };
document.getElementById('btnCloseReportArchive').onclick = function(){ closeReportArchive(); };

/* ---------------- Modal helpers ---------------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}
document.getElementById('modalBg').onclick = function(e){
  if(e.target === document.getElementById('modalBg')) closeModal();
};
function goHome(){
  document.querySelectorAll('.nav-btn').forEach(function(b,i){ b.classList.toggle('sel', i===0); });
  renderTab(0);
}
document.getElementById('btnCloseTeamScreen').onclick = function(){ closeTeamDetail(); goHome(); };
document.getElementById('btnCloseMatchScreen').onclick = function(){
  closeMatchDetail();
  document.querySelectorAll('.nav-btn').forEach(function(b,i){ b.classList.toggle('sel', i===4); });
  renderTab(4);
};
document.getElementById('btnClosePitchScreen').onclick = function(){ closePitchDetail(); goHome(); };
document.getElementById('btnCloseDrillLib').onclick = function(){ closeDrillLib(); };
document.getElementById('btnCloseCoachTrainingLib').onclick = function(){ closeCoachTrainingLib(); };
</script>
</body>
</html>
