<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root{--bg:#f5f6f8;--card:#ffffff;--card2:#eef0f3;--accent:#22b8d8;--accent2:#0ea5b8;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--text:#1c2230;--sub:#6b7280;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.screen{min-height:100vh;display:flex;flex-direction:column}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.box h1{font-size:22px;margin:0 0 6px;text-align:center}
.box p.sub{color:var(--sub);text-align:center;margin:0 0 18px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dde1e7;border-radius:10px;font-size:15px;background:#fff;color:var(--text)}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent2)}
.btn.sm{padding:7px 10px;font-size:12px;width:auto;display:inline-block}
.err{color:var(--bad);font-size:13px;margin-top:8px;display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid #e3e6ec}
.topbar b{font-size:16px}
.content{flex:1;padding:14px 16px 20px;overflow-y:auto}
.hamburger-btn{border:none;background:var(--card2);font-size:20px;border-radius:10px;width:40px;height:40px;cursor:pointer;flex:none}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;opacity:0;transition:opacity .2s}
.drawer-overlay.show{display:block;opacity:1}
.navbar{position:fixed;top:0;bottom:0;right:0;width:260px;max-width:80vw;display:flex;flex-direction:column;background:var(--card);border-left:1px solid #e3e6ec;box-shadow:-4px 0 18px rgba(0,0,0,.12);z-index:90;transform:translateX(100%);transition:transform .25s ease;padding:14px 0}
.navbar.show{transform:translateX(0)}
.navbar-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;border-bottom:1px solid #e3e6ec;margin-bottom:8px}
.navbar-head b{font-size:15px}
.nav-btn{display:flex;align-items:center;gap:10px;justify-content:flex-start;flex:none;border:none;background:none;padding:13px 18px;font-size:14px;color:var(--sub);cursor:pointer;text-align:right;width:100%}
.nav-btn .ic{font-size:20px;margin-bottom:0}
.nav-btn.sel{color:var(--accent2);font-weight:700}
.nav-btn{position:relative}
.nav-badge{position:absolute;left:14px;top:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.search-box{padding:0 16px 12px;border-bottom:1px solid #e3e6ec;margin-bottom:6px}
.search-box input{width:100%;padding:9px 12px;border:1px solid #dde1e7;border-radius:10px;font-size:14px;background:#fff;color:var(--text)}
.search-results{overflow-y:auto;flex:1;padding:0 8px}
.search-group-title{font-size:12px;color:var(--sub);font-weight:700;padding:8px 10px 4px}
.search-result-item{display:block;width:100%;border:none;background:none;padding:9px 10px;font-size:13px;color:var(--text);cursor:pointer;text-align:right;border-radius:8px}
.search-result-item:hover{background:var(--card2)}
.search-result-item .srm{color:var(--sub);font-size:11px;margin-right:6px}
.alert-card{border-right:4px solid var(--warn)}
.alert-card.danger{border-right:4px solid var(--bad)}
.section-title{font-size:18px;font-weight:700;margin:6px 0 12px}
.dash-header{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,white),color-mix(in srgb,var(--accent) 6%,white));border:1px solid color-mix(in srgb,var(--accent) 25%,white);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.dash-header .dash-greet{font-size:20px;font-weight:800;margin:0 0 4px}
.dash-header .dash-date{font-size:13px;color:var(--sub)}
.dash-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.dash-stat-card{background:var(--card);border:1px solid #e3e6ec;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.dash-stat-ic{width:38px;height:38px;flex:none;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,white);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px}
.dash-stat-num{font-size:20px;font-weight:800;line-height:1.1}
.dash-stat-label{font-size:11px;color:var(--sub)}
.dash-alert-row{background:var(--card);border:1px solid #e3e6ec;border-right:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.dash-alert-row.danger{border-right-color:var(--bad)}
.dash-alert-ic{flex:none;font-size:16px;line-height:1.4}
.dash-alert-text{font-size:13px;line-height:1.4}
.dash-empty-ok{text-align:center;color:var(--good);background:color-mix(in srgb,var(--good) 12%,white);border:1px solid color-mix(in srgb,var(--good) 30%,white);border-radius:12px;padding:16px;font-weight:700}
.card{background:var(--card);border:1px solid #e3e6ec;border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pitch-wrap{background:var(--card);border-radius:14px;padding:10px;margin-bottom:12px;overflow:hidden}
#pitchSvg{width:100%;height:auto;touch-action:none;background:#3eac46;border-radius:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar button{flex:1;min-width:90px;padding:9px 6px;border-radius:8px;border:1px solid #dde1e7;background:#fff;font-size:12px;cursor:pointer}
.toolbar button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbox-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.toolbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tbx-btn{padding:12px 4px;border-radius:10px;border:1px solid #dde1e7;background:#fff;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tbx-btn span{font-size:12px;color:var(--sub)}
.tbx-btn.sel{background:var(--accent);border-color:var(--accent)}
.tbx-btn.sel span{color:#fff}
.color-row{display:flex;gap:10px;margin-bottom:10px;justify-content:center}
.color-sw{width:32px;height:32px;border-radius:50%;border:2px solid #dde1e7;cursor:pointer;padding:0}
.color-sw.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(14,165,184,.35)}
.howto{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.frame-status{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center}
.drill-card{cursor:pointer}
.drill-card.active{outline:2px solid var(--accent);background:#e3f6fa}

.builder-screen{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.builder-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid #e3e6ec;flex:none}
.icon-btn{border:none;background:var(--card2);font-size:20px;border-radius:10px;width:42px;height:42px;cursor:pointer;flex:none}
.icon-btn.save{background:var(--good);color:#fff}
.builder-name-input{flex:1;padding:10px 12px;border:1px solid #dde1e7;border-radius:10px;font-size:15px;font-weight:700}
.builder-body{flex:1;overflow-y:auto;padding:10px 12px 30px}
.pitch-stage{background:var(--card);border-radius:14px;padding:8px;margin-bottom:10px}
.pitch-stage .pitch-wrap{margin-bottom:0}
.tool-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.tool-strip .tbx-btn{flex:none;min-width:64px}
.toolbox.grid-fallback{display:none}
.action-row{display:flex;gap:8px;margin-bottom:10px}
.action-row button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid #dde1e7;background:#fff;font-size:12px;cursor:pointer}
.action-row button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.frames-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.frame-chip{flex:none;width:78px;text-align:center;cursor:pointer}
.frame-chip svg{width:78px;height:52px;background:#3eac46;border-radius:8px;border:2px solid transparent}
.frame-chip.active svg{border-color:var(--accent)}
.frame-chip .lbl{font-size:11px;color:var(--sub);margin-top:3px}
.frame-add-chip{flex:none;width:78px;height:52px;border-radius:8px;border:2px dashed #c8cdd5;background:none;font-size:24px;color:var(--sub);cursor:pointer}
.drill-card{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:8px;margin-bottom:8px}
.drill-card svg{width:60px;height:40px;background:#3eac46;border-radius:6px;flex:none}
.week-grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.week-dayhead{display:flex;min-width:610px}
.week-daycol-head{flex:1;min-width:80px;text-align:center;font-size:12px;font-weight:700;padding-bottom:4px}
.week-grid{display:flex;min-width:610px;position:relative}
.week-hourcol{width:46px;flex:none;position:relative}
.hour-line{position:absolute;left:0;right:0;border-top:1px solid #eceff3;font-size:10px;color:var(--sub);padding-right:2px;white-space:nowrap}
.week-daycol{flex:1;min-width:80px;position:relative;border-right:1px solid #eceff3;touch-action:none}
.session-block{position:absolute;left:2px;right:2px;border-radius:6px;color:#fff;font-size:10px;line-height:1.3;padding:2px 4px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:70}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.logout-btn{background:transparent;border:none;font-size:16px;cursor:pointer;padding:2px 6px}
.badge{display:inline-block;background:var(--card2);color:var(--sub);font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
.phase-block{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:10px}
.phase-drill-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:8px 10px;margin-top:6px}
.pbadge-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.pbadge-item{flex-shrink:0;width:58px;text-align:center}
.pbadge-item .ic{font-size:22px;background:var(--card2);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 3px}
.pbadge-item.locked .ic{opacity:.3;filter:grayscale(1)}
.pbadge-item .t{font-size:9px;color:var(--sub);line-height:1.2}
.pbar-outer{height:7px;border-radius:4px;background:#e5e8ed;overflow:hidden;margin-top:5px}
.pbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.injury-tag{font-size:10px;padding:2px 8px;border-radius:10px;margin-top:3px;display:inline-block;background:var(--bad);color:#fff;font-weight:700}
.injury-tag.rehab{background:var(--warn);color:#241a00}
.report-page{background:#fff;border-radius:14px;padding:18px;max-width:680px;margin:0 auto}
.report-header{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:14px}
.report-header img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.report-header .ph-fallback{width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.report-title{font-size:19px;font-weight:800}
.report-sub{font-size:13px;color:var(--sub);margin-top:2px}
.report-section{margin-bottom:14px}
.report-section .st{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;border-right:3px solid var(--accent);padding-right:6px}
.report-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #eef0f4}
.report-feedback{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
@media print{
  .no-print{display:none !important}
  body,#appScreen,.builder-screen{background:#fff !important}
  .builder-body{overflow:visible !important;padding:0 !important}
  .report-page{box-shadow:none;max-width:100%}
}

@media (min-width:880px){
  body{display:flex;justify-content:center}
  #loginScreen .center,#loginScreen.center{min-height:100vh}
  #appScreen{min-height:100vh;width:100%;max-width:1200px}
  #appScreen .content{padding:20px 28px 28px;max-width:900px;margin:0 auto}
  .builder-screen,.modal-bg{justify-content:center}
  .builder-screen{align-items:center}
  .builder-screen > .builder-header,.builder-screen > .builder-body{width:100%;max-width:760px}
  .builder-screen{display:flex;flex-direction:column;align-items:center}
  .week-grid-wrap{max-width:100%}
}
</style>
</head>

var PLAYER_METRICS = [];
var PLAYER_METRICS_LOADED = false;
var METRIC_TYPES = ['מהירות (זמן ריצה)','שליטה בכדור','כוח','קואורדינציה','אחר'];
var metricsModalPlayerName = null, metricsModalPlayerCategory = null;
function loadPlayerMetrics(){
  if(!ME.uid) return;
  db.collection(P+'playermetrics').where('coachUid','==',ME.uid).get().then(function(snap){
    PLAYER_METRICS = snap.docs.map(function(d){ return d.data(); });
    PLAYER_METRICS_LOADED = true;
    if(currentTeamCategory) renderTeamDetail();
    if(metricsModalPlayerName) renderPlayerMetricsModal();
  });
}
function metricsForPlayer(name, category){
  return PLAYER_METRICS.filter(function(m){ return m.playerName===name && m.category===category; });
}
function openPlayerMetricsModal(playerName, category){
  metricsModalPlayerName = playerName;
  metricsModalPlayerCategory = category;
  renderPlayerMetricsModal();
}
function metricTypeSelectHtml(id){
  return '<select id="'+id+'">'+METRIC_TYPES.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('')+'</select>';
}
function metricProgressHtml(entries){
  if(entries.length<2) return '';
  var sorted = entries.slice().sort(function(a,b){ return (a.test_date||'').localeCompare(b.test_date||''); });
  var latest = sorted[sorted.length-1], prev = sorted[sorted.length-2];
  var vLatest = parseFloat(latest.score_value), vPrev = parseFloat(prev.score_value);
  var bothNumeric = !isNaN(vLatest) && !isNaN(vPrev) && (''+latest.score_value).trim()!=='' && (''+prev.score_value).trim()!=='';
  if(!bothNumeric){
    return '<div class="muted" style="font-size:11px">'+prev.score_value+' ('+(prev.test_date||'-')+') ← '+latest.score_value+' ('+(latest.test_date||'-')+')</div>';
  }
  var arrow = vLatest>vPrev ? '▲' : (vLatest<vPrev ? '▼' : '–');
  var maxAbs = Math.max(Math.abs(vLatest), Math.abs(vPrev)) || 1;
  return '<div style="font-size:12px;margin-bottom:2px">'+prev.score_value+' ← '+latest.score_value+' '+arrow+'</div>'+
    '<div class="pbar-outer"><div class="pbar-fill" style="width:'+Math.min(100, Math.abs(vLatest)/maxAbs*100)+'%"></div></div>'+
    '<div class="muted" style="font-size:10px;margin-top:2px">ערך נמוך יותר יכול להיות שיפור או החמרה בהתאם לסוג המבדק</div>';
}
function renderPlayerMetricsModal(){
  var name = metricsModalPlayerName, category = metricsModalPlayerCategory;
  var entries = metricsForPlayer(name, category);
  var byType = {};
  entries.forEach(function(m){
    if(!byType[m.metric_type]) byType[m.metric_type] = [];
    byType[m.metric_type].push(m);
  });
  var types = Object.keys(byType);
  var html = '<h3 style="margin-bottom:14px">📈 מבדקים ומדדים — '+name+'</h3>';
  if(!PLAYER_METRICS_LOADED){
    html += '<div class="muted" style="font-size:12px">טוען מבדקים...</div>';
  } else if(types.length===0){
    html += '<div class="muted" style="margin-bottom:10px">אין עדיין מבדקים</div>';
  } else {
    html += types.map(function(t){
      var list = byType[t].slice().sort(function(a,b){ return (b.test_date||'').localeCompare(a.test_date||''); });
      return '<div class="card"><div class="section-title" style="font-size:13px">'+t+'</div>'+
        metricProgressHtml(byType[t])+
        list.map(function(m){
          return '<div class="row" style="padding:4px 0;border-bottom:1px solid #e3e6ec;font-size:12px">'+
            '<div><b>'+m.score_value+'</b><span class="muted" style="margin-right:6px">'+(m.test_date||'')+'</span>'+
            (m.coach_notes ? '<div class="muted" style="font-size:11px">'+m.coach_notes+'</div>' : '')+'</div>'+
            '<button class="logout-btn" data-delmetric="'+m.id+'" title="מחק">🗑</button>'+
          '</div>';
        }).join('')+
      '</div>';
    }).join('');
  }
  html += '<div class="section-title" style="font-size:14px;margin-top:14px">+ הוסף מבדק</div>'+
    '<div class="field"><label>סוג מבדק</label>'+metricTypeSelectHtml('metricTypeInput')+'</div>'+
    '<div class="field"><label>תוצאה</label><input id="metricScoreInput" placeholder="לדוגמה: 12.3 שניות / 8/10"></div>'+
    '<div class="field"><label>תאריך</label><input type="date" id="metricDateInput" value="'+todayIso()+'"></div>'+
    '<div class="field"><label>הערות</label><textarea id="metricNotesInput" rows="2" placeholder="הערות (אופציונלי)"></textarea></div>'+
    '<button class="btn" id="btnSaveMetric">שמור מבדק</button>'+
    '<button class="btn ghost sm" id="btnCloseMetrics" style="margin-top:8px">סגור</button>';
  openModal(html);
  document.getElementById('btnSaveMetric').onclick = function(){
    var scoreVal = document.getElementById('metricScoreInput').value.trim();
    if(!scoreVal) return;
    var m = {
      id: genCode(8),
      coachUid: ME.uid,
      playerName: name,
      category: category,
      metric_type: document.getElementById('metricTypeInput').value,
      test_date: document.getElementById('metricDateInput').value || todayIso(),
      score_value: scoreVal,
      coach_notes: document.getElementById('metricNotesInput').value.trim()
    };
    db.collection(P+'playermetrics').doc(m.id).set(m).then(function(){
      PLAYER_METRICS.push(m);
      renderPlayerMetricsModal();
    });
  };
  document.querySelectorAll('[data-delmetric]').forEach(function(btn){
    btn.onclick = function(){
      if(!confirm('למחוק את המבדק?')) return;
      var id = btn.dataset.delmetric;
      db.collection(P+'playermetrics').doc(id).delete().then(function(){
        PLAYER_METRICS = PLAYER_METRICS.filter(function(x){ return x.id!==id; });
        renderPlayerMetricsModal();
      });
    };
  });
  document.getElementById('btnCloseMetrics').onclick = function(){
    metricsModalPlayerName = null;
    metricsModalPlayerCategory = null;
    closeModal();
  };
}

function videoEmbedHtml(url){
  if(!url) return '';
  var yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
  if(yt){
    return '<div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin-bottom:12px">'+
      '<iframe src="https://www.youtube.com/embed/'+yt[1]+'" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe>'+
    '</div>';
  }
  return '<a href="'+url+'" target="_blank" rel="noopener" class="btn ghost" style="margin-bottom:12px;display:block;text-align:center">🎬 פתח סרטון</a>';

   server-side endpoint (e.g. a Firebase Cloud Function holding the
   model API key) exists, replace the body of this function with a
   fetch() call to it. Never call an AI provider directly from the

function analyzeMatchVideo(m){
  m.aiStatus = 'analyzing';
  renderMatchDetail();
  setTimeout(function(){
    var roster = (CLUB_TEAMS[m.category] || {players:[]}).players || [];
    var evs = eventsForMatch(m.id);
    var analysis = mockMatchAnalysis(m, roster, evs);
    m.aiAnalysis = analysis;

    renderMatchDetail();
  }, 1800);

function mockMatchAnalysis(m, roster, evs){
  var goals = evs.filter(function(e){ return e.type==='goal'; });
  var summary = evs.length
    ? 'סיכום ראשוני שנבנה מהאירועים שתויגו ידנית: '+evs.length+' אירועים תועדו במשחק מול '+(m.opponent||'היריבה')+', כולל '+goals.length+' שערים. לאחר חיבור מודל AI אמיתי לניתוח וידאו, כאן יופיע ניתוח מלא שנגזר ישירות מקובץ המשחק (תנועה, החזקת כדור, אזורי פעילות ועוד).'
    : 'עדיין לא תויגו אירועים למשחק זה. תייג/י שערים, מסירות מפתח וכרטיסים על ציר הזמן כדי לקבל כאן סיכום עשיר יותר, עד לחיבור ניתוח AI אמיתי מקובץ הווידאו.';
  var keyMoments = goals.slice(0,5).map(function(g){
    return {minute:g.minute||0, text:'⚽ שער'+(g.playerName?' — '+g.playerName:'')+(g.note?' ('+g.note+')':'')};
  });
  var playerRatings = roster.slice(0,8).map(function(p){
    var pEvs = evs.filter(function(e){ return e.playerName===p.name; });

  return {summary:summary, keyMoments:keyMoments, playerRatings:playerRatings, generatedAt:Date.now(), demo:true};
}

function todayIso(){

  var mm = (''+(d.getMonth()+1)).padStart ? (''+(d.getMonth()+1)).padStart(2,'0') : ((d.getMonth()+1)<10?'0':'')+(d.getMonth()+1);
  var dd = (''+d.getDate()).padStart ? (''+d.getDate()).padStart(2,'0') : (d.getDate()<10?'0':'')+d.getDate();
  return d.getFullYear()+'-'+mm+'-'+dd;

var DAYS = [{k:'sun',l:'יום א\''},{k:'mon',l:'יום ב\''},{k:'tue',l:'יום ג\''},{k:'wed',l:'יום ד\''},{k:'thu',l:'יום ה\''},{k:'fri',l:'יום ו\''},{k:'sat',l:'שבת'}];
var HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function startOfWeek(d){
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
var CURRENT_WEEK_START = startOfWeek(new Date());
function addDays(d, n){
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  dt.setDate(dt.getDate() + n);
  return dt;
}
function weekOfMonth(d){
  var firstOfMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  var firstWeekStart = startOfWeek(firstOfMonth);
  return Math.floor((d.getTime() - firstWeekStart.getTime()) / (7*24*60*60*1000)) + 1;
}
function fmtDateShort(d){ return d.getDate()+' ב'+HEB_MONTHS[d.getMonth()]; }
function weekHeaderLabel(weekStart){
  var weekEnd = addDays(weekStart, 6);
  var monthLabel = HEB_MONTHS[weekEnd.getMonth()]+' '+weekEnd.getFullYear();
  var wom = weekOfMonth(weekStart);
  return monthLabel+' · שבוע '+wom+' ('+fmtDateShort(weekStart)+' - '+fmtDateShort(weekEnd)+')';
}
function genTimeSlots(){
  var arr = [], h = 14, m = 0;
  while(h<23 || (h===23 && m===0)){
    arr.push((h<10?'0':'')+h+':'+(m===0?'00':m));
    m += 15;
    if(m===60){ m=0; h++; }
  }
  return arr;
}

/* ---------------- Alerts / reminders ---------------- */
var LOW_PUNCH_THRESHOLD = 2;
var MEDICAL_EXPIRY_WARN_DAYS = 14;
function daysBetween(dateStr){
  // returns (dateStr - today) in days, dateStr is 'YYYY-MM-DD'
  var d = new Date(dateStr+'T00:00:00');
  var today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((d.getTime()-today.getTime())/86400000);
}
function computeAlerts(){
  var alerts = [];
  AGE_GROUPS.forEach(function(cat){
    if(!categoryAllowed(cat)) return;
    var t = CLUB_TEAMS[cat];
    if(!t || !t.players) return;
    t.players.forEach(function(pl){
      // 1. Low punch-card balance
      if(pl.sub_type==='punch' && typeof pl.remaining_punches==='number' && pl.remaining_punches<=LOW_PUNCH_THRESHOLD){
        alerts.push({type:'punch', severity:'warning', category:cat, playerName:pl.name,
          text:'לשחקן '+pl.name+' נותרו '+pl.remaining_punches+' ניקובים בכרטיסייה'});
      }
      // 2. Medical approval
      if(pl.medical_approval===false){
        alerts.push({type:'medical', severity:'danger', category:cat, playerName:pl.name,
          text:'לשחקן '+pl.name+' אין אישור רפואי בתוקף'});
      } else if(pl.medical_expiry){
        var diff = daysBetween(pl.medical_expiry);
        if(diff<0){
          alerts.push({type:'medical', severity:'danger', category:cat, playerName:pl.name,
            text:'אישור רפואי של '+pl.name+' פג תוקף'});
        } else if(diff<=MEDICAL_EXPIRY_WARN_DAYS){
          alerts.push({type:'medical', severity:'warning', category:cat, playerName:pl.name,
            text:'אישור רפואי של '+pl.name+' עומד לפוג ב-'+pl.medical_expiry});
        }
      }
      // 3. Injury status
      if(pl.injury_status==='injured' || pl.injury_status==='rehab'){
        alerts.push({type:'injury', severity:(pl.injury_status==='injured'?'danger':'warning'), category:cat, playerName:pl.name,
          text:(pl.injury_status==='injured'?'השחקן '+pl.name+' מוגדר כפצוע':'השחקן '+pl.name+' נמצא בתהליך שיקום')+
            (pl.injury_expected_return?(' · חזרה משוערת: '+pl.injury_expected_return):'')});
      }
    });
  });
  // 3. Consecutive absences: scan PITCHES (best-effort chronological order:
  // pitches in array order, days in DAYS order sun..sat, sessions in schedule order per day).
  // Note: there is no absolute date per session beyond day-of-week, so this is a
  // best-effort ordering proxy across all pitches/sessions rather than true calendar order.
  var streaks = {}; // name -> current consecutive absent streak
  var flagged = {}; // name -> already flagged (avoid duplicate alerts per player)
  PITCHES.forEach(function(p){
    DAYS.forEach(function(d){
      var sessions = (p.schedule && p.schedule[d.k]) || [];
      sessions.forEach(function(s){
        var attendance = s.attendance || {};
        for(var name in attendance){
          var val = attendance[name];
          if(val==='absent'){
            streaks[name] = (streaks[name]||0)+1;
            if(streaks[name]>=3 && !flagged[name]){
              flagged[name] = true;
              var absCat = findPlayerCategory(name);
              if(categoryAllowed(absCat)){
                alerts.push({type:'absence', severity:'danger', category:absCat, playerName:name,
                  text:'לשחקן '+name+' 3 היעדרויות רצופות'});
              }
            }
          } else {
            streaks[name] = 0;
          }
        }
      });
    });
  });
  return alerts;
}
function findPlayerCategory(name){
  for(var i=0;i<AGE_GROUPS.length;i++){
    var t = CLUB_TEAMS[AGE_GROUPS[i]];
    if(t && t.players && t.players.some(function(pl){ return pl.name===name; })) return AGE_GROUPS[i];
  }
  return '';
}

function globalSearch(query){
  var q = (query||'').trim().toLowerCase();
  var res = {players:[], coaches:[], teams:[]};
  if(!q) return res;
  AGE_GROUPS.forEach(function(cat){
    if(!categoryAllowed(cat)) return;
    if(cat.toLowerCase().indexOf(q)!==-1){
      res.teams.push({name:cat, category:cat});
    }
    var t = CLUB_TEAMS[cat];
    if(!t) return;
    (t.players||[]).forEach(function(p){
      if(p.name && p.name.toLowerCase().indexOf(q)!==-1){
        res.players.push({name:p.name, category:cat});
      }
    });
    (t.staff||[]).forEach(function(s){
      if(s.name && s.name.toLowerCase().indexOf(q)!==-1){
        res.coaches.push({name:s.name, category:cat, role:s.role||''});
      }
    });
  });
  return res;
}

    return '<div class="dash-stat-card"><div class="dash-stat-ic">'+s.ic+'</div>'+
      '<div><div class="dash-stat-num">'+s.num+'</div><div class="dash-stat-label">'+s.label+'</div></div></div>';
  }).join('')+'</div>';
}
function alertSeverityIcon(a){
  if(a.severity==='danger') return '🔴';
  return '🟡';
}
function alertsSectionHtml(alerts){
  if(!alerts) alerts = computeAlerts();
  var head = '<div class="row" style="margin-bottom:8px"><div class="section-title" style="margin:0">🔔 התראות</div>'+
    (alerts.length>0 ? '<span class="badge">'+alerts.length+'</span>' : '')+'</div>';
  if(alerts.length===0){
    return head+'<div class="dash-empty-ok">הכל תקין ✅</div>';
  }
  var sorted = alerts.slice().sort(function(a,b){
    if(a.severity===b.severity) return 0;
    return a.severity==='danger' ? -1 : 1;
  });
  return head + sorted.map(function(a){
    return '<div class="dash-alert-row'+(a.severity==='danger'?' danger':'')+'">'+
      '<div class="dash-alert-ic">'+alertSeverityIcon(a)+'</div>'+
      '<div class="dash-alert-text">'+a.text+
        (a.category ? '<div class="muted" style="margin-top:2px;font-size:11px">'+a.category+'</div>' : '')+
      '</div>'+
    '</div>';
  }).join('');
}

/* ---------------- Auth: email + password, with mandatory email verification ----------------
   Registration also collects a phone number, but it's stored as a plain contact field on the
   fc_coaches profile now -- it is no longer the auth identity (see resolvePendingInvitesForMe,
   which still matches invites by that stored phone). */
function showAuthStep(id){
  ['stepAuth','stepRegister','stepVerifyEmail','stepProfile'].forEach(function(s){
    document.getElementById(s).style.display = (s===id) ? 'block' : 'none';
  });
}
document.getElementById('btnGoRegister').onclick = function(){ showAuthStep('stepRegister'); };
document.getElementById('btnGoLogin').onclick = function(){ showAuthStep('stepAuth'); };
document.getElementById('btnLogin').onclick = function(){
  var email = document.getElementById('authEmailInput').value.trim();
  var pw = document.getElementById('authPasswordInput').value;
  if(!email || !pw) return;
  document.getElementById('authErr').style.display = 'none';
  auth.signInWithEmailAndPassword(email, pw).catch(function(err){
    console.error(err);
    document.getElementById('authErr').style.display = 'block';
  });
  // success is picked up by onAuthStateChanged below
};
document.getElementById('btnRegister').onclick = function(){
  var email = document.getElementById('regEmailInput').value.trim();
  var pw = document.getElementById('regPasswordInput').value;
  if(!email || pw.length<6) return;
  document.getElementById('regErr').style.display = 'none';
  auth.createUserWithEmailAndPassword(email, pw).then(function(cred){
    return cred.user.sendEmailVerification();
  }).catch(function(err){
    console.error(err);
    document.getElementById('regErr').style.display = 'block';
  });
  // success is picked up by onAuthStateChanged below
};
document.getElementById('btnResendVerify').onclick = function(){
  if(auth.currentUser) auth.currentUser.sendEmailVerification();
};
document.getElementById('btnCheckVerified').onclick = function(){
  if(!auth.currentUser) return;
  document.getElementById('verifyErr').style.display = 'none';
  auth.currentUser.reload().then(function(){
    if(auth.currentUser.emailVerified) afterEmailVerified();
    else document.getElementById('verifyErr').style.display = 'block';
  });
};
document.getElementById('btnLogoutFromVerify').onclick = function(){ auth.signOut(); };
function afterEmailVerified(){
  var user = auth.currentUser;
  ME.uid = user.uid;
  db.collection(P+'coaches').doc(ME.uid).get().then(function(doc){
    if(doc.exists){
      var data = doc.data();
      ME.name = data.name;
      ME.role = data.role;
      ME.clubId = data.clubId || '';
      ME.phone = data.phone || '';
      resolvePendingInvitesForMe(function(){ enterApp(); });
    } else {
      showAuthStep('stepProfile');
    }
  });
}
document.getElementById('btnSaveProfile').onclick = function(){
  var n = document.getElementById('profNameInput').value.trim();
  if(!n) return;
  ME.name = n;
  ME.phone = document.getElementById('profPhoneInput').value.trim();
  ME.role = document.getElementById('profRoleInput').value;
  db.collection(P+'coaches').doc(ME.uid).set({
    uid: ME.uid,
    email: auth.currentUser ? auth.currentUser.email : '',
    phone: ME.phone,
    name: ME.name,
    role: ME.role,
    clubId: ME.clubId || ''
  }).then(function(){
    resolvePendingInvitesForMe(function(){ enterApp(); });
  });
};
document.getElementById('btnLogout').onclick = function(){
  auth.signOut().then(function(){
    ME = {uid:'', phone:'', name:'', role:'coach', clubId:'', isSuperAdmin:false};
    MY_CLUB = null;
    MY_CLUB_LOADED = false;
    applyClubTheme(null);
    TRAINING_PLANS = []; TRAINING_PLANS_LOADED = false;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    showAuthStep('stepAuth');
    document.getElementById('authEmailInput').value = '';
    document.getElementById('authPasswordInput').value = '';
  });
};
auth.onAuthStateChanged(function(user){
  if(!user || ME.uid) return;
  if(!user.emailVerified){
    document.getElementById('verifyEmailAddr').textContent = user.email || '';
    showAuthStep('stepVerifyEmail');
    return;
  }
  afterEmailVerified();
});

function renderTab(i){
  TAB = i;
  var c = document.getElementById('content');
  // A manager whose club is pending Super Admin approval (or was rejected) gets a blocked
  // screen on every tab except Settings, where they can see status / resubmit.
  if(ME.role==='manager' && MY_CLUB_LOADED && MY_CLUB && i!==3 && (MY_CLUB.status==='pending' || MY_CLUB.status==='rejected')){
    c.innerHTML = '<div class="section-title">⏳ ממתין לאישור</div>'+clubPendingScreenHtml(MY_CLUB.status);
    wireClubPendingScreen();
    return;
  }
  if(i===0) c.innerHTML = tplPlans();
  else if(i===1) c.innerHTML = tplTeams();
  else if(i===2) c.innerHTML = tplPitches();
  else if(i===3) c.innerHTML = tplSettings();
  else if(i===4) c.innerHTML = tplMatches();
  else if(i===SUPERADMIN_TAB_ID) c.innerHTML = tplSuperAdmin();
  wireTab(i);
}

    '<div class="field"><label>קישור למדיה (אופציונלי)</label><input id="drillMediaInput" placeholder="https://..." value="'+(d?(d.media_url||''):'')+'"></div>'+
    '<button class="btn" id="btnSaveDrillLib">'+(isEdit?'שמור שינויים':'הוסף')+'</button>';

var SKILL_ATTRS = [
  {k:'power', l:'כוח'},
  {k:'technique', l:'טכניקה'},
  {k:'coordination', l:'קואורדינציה'},
  {k:'dribbling', l:'כדרור'},
  {k:'speed', l:'מהירות'},

];

/* ---------------- Player badges / achievements ---------------- */
var INJURY_STATUS_INFO = {
  healthy:{ic:'✅',t:'בריא'},
  injured:{ic:'🩹',t:'פצוע'},
  rehab:{ic:'🦵',t:'בשיקום'}
};
var PHYSICAL_ATTRS = [
  {k:'rating_speed', l:'מהירות'},
  {k:'rating_strength', l:'כוח'},
  {k:'rating_technique', l:'טכניקה'},
  {k:'rating_endurance', l:'סבולת'}
];
var BADGES = [
  {id:'attend10', ic:'🏅', t:'10 אימונים', d:'נוכחות ב-10 אימונים לפחות'},
  {id:'attend25', ic:'🎖️', t:'25 אימונים', d:'נוכחות ב-25 אימונים לפחות'},
  {id:'streak5', ic:'🔥', t:'רצף נוכחות', d:'5 אימונים רצופים ברצף ללא היעדרות'},
  {id:'fullskills', ic:'⭐', t:'שחקן מושלם', d:'כל היכולות (1-5) בציון 4 ומעלה'},
  {id:'pom', ic:'👑', t:'שחקן החודש', d:'הוענק ע"י המאמן'}
];
function countPlayerAttendance(playerName){
  var present = 0, maxStreak = 0, curStreak = 0;
  PITCHES.forEach(function(p){
    DAYS.forEach(function(d){
      var sessions = (p.schedule && p.schedule[d.k]) || [];
      sessions.forEach(function(s){
        var att = s.attendance || {};
        var val = att[playerName];
        if(val===undefined) return;
        if(val==='present'){
          present++;
          curStreak++;
          if(curStreak>maxStreak) maxStreak = curStreak;
        } else {
          curStreak = 0;
        }
      });
    });
  });
  return {present:present, maxStreak:maxStreak};
}
function computePlayerBadges(player){
  var earned = {};
  var stats = countPlayerAttendance(player.name);
  if(stats.present>=10) earned.attend10 = true;
  if(stats.present>=25) earned.attend25 = true;
  if(stats.maxStreak>=5) earned.streak5 = true;
  if(player.skills){
    var allHigh = SKILL_ATTRS.every(function(sk){ return (player.skills[sk.k]||0)>=4; });
    if(allHigh) earned.fullskills = true;
  }
  if(player.badges && player.badges.indexOf('pom')!==-1) earned.pom = true;
  return earned;
}
function playerBadgeRowHtml(player){
  var earned = computePlayerBadges(player);
  return '<div class="pbadge-row">'+BADGES.map(function(b){
    var got = !!earned[b.id];
    return '<div class="pbadge-item '+(got?'':'locked')+'" title="'+b.t+' — '+b.d+'"><div class="ic">'+b.ic+'</div><div class="t">'+b.t+'</div></div>';
  }).join('')+'</div>';
}
function playerPhysicalBarsHtml(player){
  return PHYSICAL_ATTRS.map(function(a){

function ratingSelect(id, selected){
  var opts = '';
  for(var i=1;i<=5;i++) opts += '<option value="'+i+'"'+(i===selected?' selected':'')+'>'+i+'</option>';
  return '<select id="'+id+'">'+opts+'</select>';
}

var GRID_ROW_H = 18;
var GRID_START_MIN = 14*60;
var GRID_END_MIN = 23*60;
var SESSION_COLORS = ['#22b8d8','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c'];
function timeToMin(t){ var p = t.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function minToTime(m){ var h = Math.floor(m/60), mm = m%60; return (h<10?'0':'')+h+':'+(mm===0?'00':mm); }
function renderPitchDetail(){
  var p = PITCHES[currentPitchIdx];
  document.getElementById('pitchScreenTitle').textContent = p.name;
  var gridH = ((GRID_END_MIN-GRID_START_MIN)/15)*GRID_ROW_H;
  var hourLines = '';
  for(var hm=GRID_START_MIN; hm<=GRID_END_MIN; hm+=60){
    var top = ((hm-GRID_START_MIN)/15)*GRID_ROW_H;
    hourLines += '<div class="hour-line" style="top:'+top+'px">'+minToTime(hm)+'</div>';
  }
  var body = document.getElementById('pitchScreenBody');
  body.innerHTML =
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="btn ghost sm" id="btnWeekPrev" style="width:auto">◀ שבוע קודם</button>'+
      '<b id="weekHeaderLabel" style="cursor:pointer;text-align:center;flex:1" title="לחץ לבחירת שבוע">'+weekHeaderLabel(CURRENT_WEEK_START)+'</b>'+
      '<button class="btn ghost sm" id="btnWeekNext" style="width:auto">שבוע הבא ▶</button>'+
    '</div>'+
    '<div class="muted" style="margin-bottom:8px">לחיצה ארוכה על שעה ריקה בלוז מוסיפה אימון חדש. לחיצה על אימון קיים פותחת פרטים. הלוז חוזר על עצמו בכל שבוע (תבנית שבועית).</div>'+
    '<button class="btn ghost sm" id="btnAddSession" style="margin-bottom:10px">+ הוספת אימון</button>'+
    '<div class="week-grid-wrap">'+
      '<div class="week-dayhead"><div class="week-hourcol"></div>'+
        DAYS.map(function(d){ return '<div class="week-daycol-head">'+d.l+'</div>'; }).join('')+
      '</div>'+
      '<div class="week-grid">'+
        '<div class="week-hourcol" style="height:'+gridH+'px">'+hourLines+'</div>'+
        DAYS.map(function(d){
          var sessions = p.schedule[d.k] || [];
          var blocks = sessions.map(function(s,i){
            var top = ((timeToMin(s.start)-GRID_START_MIN)/15)*GRID_ROW_H;
            var h = ((timeToMin(s.end)-timeToMin(s.start))/15)*GRID_ROW_H;
            return '<div class="session-block" data-day="'+d.k+'" data-sessidx="'+i+'" style="top:'+top+'px;height:'+(h-2)+'px;background:'+(s.color||SESSION_COLORS[0])+'">'+
              '<b>'+s.category+'</b><br>'+s.start+'-'+s.end+
            '</div>';
          }).join('');
          return '<div class="week-daycol" data-day="'+d.k+'" style="height:'+gridH+'px">'+blocks+'</div>';
        }).join('')+
      '</div>'+
    '</div>';
  document.getElementById('btnAddSession').onclick = function(){ openAddSessionModal(currentPitchDay||'sun', null); };
  document.getElementById('btnWeekPrev').onclick = function(){
    CURRENT_WEEK_START = addDays(CURRENT_WEEK_START, -7);
    renderPitchDetail();
  };
  document.getElementById('btnWeekNext').onclick = function(){
    CURRENT_WEEK_START = addDays(CURRENT_WEEK_START, 7);
    renderPitchDetail();
  };
  document.getElementById('weekHeaderLabel').onclick = function(){
    openWeekPickerModal();
  };
  document.querySelectorAll('.session-block').forEach(function(el){
    el.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    el.onclick = function(e){
      e.stopPropagation();
      openSessionDetailModal(el.dataset.day, parseInt(el.dataset.sessidx,10));
    };
  });
  document.querySelectorAll('.week-daycol').forEach(function(col){
    var pressTimer = null;
    col.addEventListener('pointerdown', function(e){
      if(e.target.closest && e.target.closest('.session-block')) return;
      var rect = col.getBoundingClientRect();
      var y = e.clientY - rect.top;
      pressTimer = setTimeout(function(){
        pressTimer = null;
        var startMin = GRID_START_MIN + Math.round(y/GRID_ROW_H)*15;
        if(startMin > GRID_END_MIN-15) startMin = GRID_END_MIN-15;
        openAddSessionModal(col.dataset.day, minToTime(startMin));
      }, 550);
    });
    ['pointerup','pointermove','pointercancel','pointerleave'].forEach(function(evt){
      col.addEventListener(evt, function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } });
    });
  });
}

  var html = '<h3 style="margin-bottom:14px">דילוג לשבוע מסוים</h3>'+

function getTeamCoachName(cat){
  var t = CLUB_TEAMS[cat];
  return (t && t.staff && t.staff.length) ? t.staff[0].name : '';
}
function findScheduleConflict(day, start, end, category, targetPitchId, excludeSessionIdx){
  var newStart = timeToMin(start), newEnd = timeToMin(end);
  var newCoach = getTeamCoachName(category);
  for(var pi=0; pi<PITCHES.length; pi++){
    var pitch = PITCHES[pi];
    var sessions = (pitch.schedule && pitch.schedule[day]) || [];
    for(var si=0; si<sessions.length; si++){
      if(pitch.id===targetPitchId && si===excludeSessionIdx) continue;
      var s = sessions[si];
      var sStart = timeToMin(s.start), sEnd = timeToMin(s.end);
      var overlaps = (newStart < sEnd) && (newEnd > sStart);
      if(!overlaps) continue;
      if(pitch.id===targetPitchId){
        return {type:'pitch', pitch:pitch, session:s};
      }
      var sCoach = getTeamCoachName(s.category);
      if(newCoach && sCoach && newCoach===sCoach){
        return {type:'coach', pitch:pitch, session:s, coach:newCoach};
      }
    }
  }
  return null;
}
function openAddSessionModal(day, startTime){
  var start = startTime || TIME_SLOTS[0];
  var startIdx = TIME_SLOTS.indexOf(start);
  var defEnd = TIME_SLOTS[Math.min(startIdx+4, TIME_SLOTS.length-1)];
  var html = '<h3 style="margin-bottom:14px">הוספת אימון</h3>'+
    '<div class="field"><label>יום</label><select id="sessionDayInput">'+
      DAYS.map(function(d){ return '<option value="'+d.k+'"'+(d.k===day?' selected':'')+'>'+d.l+'</option>'; }).join('')+
    '</select></div>'+

function chargePunch(pl){
  if(pl.sub_type==='punch' && typeof pl.remaining_punches==='number') pl.remaining_punches = Math.max(0, pl.remaining_punches-1);
}
function refundPunch(pl){
  if(pl.sub_type==='punch' && typeof pl.remaining_punches==='number') pl.remaining_punches = pl.remaining_punches+1;
}

    s.guests = guests;

    savePitch(p);

function joinClubByCode(code){
  if(!code) return;
  db.collection(P+'clubs').where('inviteCode','==',code).get().then(function(snap){
    if(snap.empty){
      alert('קוד הזמנה לא נמצא');
      return;
    }
    var doc = snap.docs[0];
    var clubId = doc.id;
    setMyClubId(clubId);
    db.collection(P+'coaches').doc(ME.uid).set({clubId:ME.clubId}, {merge:true});
    var fv = (firebase.firestore && firebase.firestore.FieldValue) ? firebase.firestore.FieldValue : null;
    if(fv && fv.arrayUnion){
      doc.ref.update({coaches: fv.arrayUnion(ME.uid)});
    } else {
      var data = doc.data();
      var coaches = data.coaches || [];
      if(coaches.indexOf(ME.uid)===-1) coaches.push(ME.uid);
      doc.ref.set({coaches:coaches}, {merge:true});

    CLUB_TEAMS_LOADED = false;
    PITCHES_LOADED = false;
    loadMyClub();
    renderTab(3);
  });

// Reuses the exact same phone formatting convention as the phone-OTP login (line ~858):
// local numbers get a +972 prefix with the leading 0 stripped; already-international numbers pass through.
function formatPhoneIL(phone){
  phone = (phone||'').trim();
  if(!phone) return '';
  return phone.charAt(0)==='+' ? phone : ('+972'+phone.replace(/^0/,''));
}

  return '<div class="muted" style="margin-top:10px">הזמנות בהמתנה (יתממשו כשהמאמן יתחבר עם הטלפון הזה)</div>'+

        '<button class="logout-btn" data-cancelinvite="'+inv.phone+'" title="בטל">🗑</button></div>';
    }).join('');
}
// Invite a coach by phone number: reuses the SAME phone->uid resolution mechanism as login
// (db.collection(P+'coaches') is keyed by the Firebase Auth uid, with a stored phone field set
// at profile-save time / from result.user.phoneNumber). If a coach record with that phone already
// exists, add them to coaches[]/memberInfo immediately (same as joinClubByCode). Otherwise store a
// pendingInvites entry that gets resolved on that phone's next login (see resolvePendingInvitesForMe()).
function inviteCoachByPhone(rawPhone){
  if(!MY_CLUB || ME.role!=='manager') return;
  var phone = formatPhoneIL(rawPhone);
  if(!phone) return;
  var clubRef = db.collection(P+'clubs').doc(ME.uid);
  db.collection(P+'coaches').where('phone','==',phone).get().then(function(snap){
    var fv = (firebase.firestore && firebase.firestore.FieldValue) ? firebase.firestore.FieldValue : null;
    if(!snap.empty){
      var coachDoc = snap.docs[0];
      var uid = coachDoc.id;
      if(fv && fv.arrayUnion){
        clubRef.update({coaches: fv.arrayUnion(uid)});
      } else {
        var coaches = (MY_CLUB.coaches || []).slice();
        if(coaches.indexOf(uid)===-1) coaches.push(uid);
        clubRef.set({coaches:coaches}, {merge:true});
      }
      coachDoc.ref.set({clubId:ME.uid}, {merge:true});
      if(MY_CLUB.coaches && MY_CLUB.coaches.indexOf(uid)===-1) MY_CLUB.coaches.push(uid);
      alert('המאמן הוזמן והצטרף למועדון');
      MY_CLUB_LOADED = false;
      loadMyClub();
      renderTab(3);
    } else {
      var invites = (MY_CLUB.pendingInvites || []).filter(function(inv){ return inv.phone!==phone; });
      invites.push({phone:phone, addedAt: Date.now()});
      clubRef.set({pendingInvites:invites}, {merge:true}).then(function(){
        MY_CLUB.pendingInvites = invites;
        alert('הוזמן בהצלחה — ההזמנה תתממש כאשר המאמן יתחבר לראשונה עם הטלפון הזה');
        renderTab(3);
      });
    }
  });
}
function cancelPendingInvite(phone){
  if(!MY_CLUB || ME.role!=='manager') return;
  var invites = (MY_CLUB.pendingInvites || []).filter(function(inv){ return inv.phone!==phone; });
  MY_CLUB.pendingInvites = invites;
  db.collection(P+'clubs').doc(ME.uid).set({pendingInvites:invites}, {merge:true}).then(function(){
    renderTab(3);
  });
}
// Called once ME.uid/ME.phone are known on login (real phone-OTP flow), BEFORE enterApp().
// Scans every club's pendingInvites for a matching phone and auto-joins that club, mirroring
// joinClubByCode's coaches[]/clubId wiring. Removes the resolved entry from pendingInvites.
// No-op when ME.phone is empty (e.g. LOGIN_DISABLED local mode, which has no real phone number).
function resolvePendingInvitesForMe(cb){
  if(!ME.phone || !ME.uid){ if(cb) cb(); return; }
  db.collection(P+'clubs').get().then(function(snap){
    var matchDoc = null, matchClubId = null;
    snap.forEach(function(doc){
      var data = doc.data();
      if(matchDoc) return;
      var invites = data.pendingInvites || [];
      if(invites.some(function(inv){ return inv.phone===ME.phone; })){
        matchDoc = doc; matchClubId = doc.id;
      }
    });
    if(!matchDoc){ if(cb) cb(); return; }
    var data = matchDoc.data();
    var remainingInvites = (data.pendingInvites||[]).filter(function(inv){ return inv.phone!==ME.phone; });
    var fv = (firebase.firestore && firebase.firestore.FieldValue) ? firebase.firestore.FieldValue : null;
    var clubRef = matchDoc.ref;
    var updates = {pendingInvites: remainingInvites};
    if(fv && fv.arrayUnion){
      clubRef.update(updates);
      clubRef.update({coaches: fv.arrayUnion(ME.uid)});
    } else {
      var coaches = (data.coaches || []).slice();
      if(coaches.indexOf(ME.uid)===-1) coaches.push(ME.uid);
      updates.coaches = coaches;
      clubRef.set(updates, {merge:true});
    }
    ME.clubId = matchClubId;
    db.collection(P+'coaches').doc(ME.uid).set({clubId:matchClubId}, {merge:true}).then(function(){
      if(cb) cb();
    });
  }).catch(function(err){
    console.error('resolvePendingInvitesForMe failed', err);
    if(cb) cb();
  });
}
function leaveClub(){

function updateClubMemberInfo(uid, patch){

  var clubRef = db.collection(P+'clubs').doc(clubOwnerUid()===ME.uid ? ME.uid : MY_CLUB.adminUid);
  var mi = MY_CLUB.memberInfo || {};
  var current = mi[uid] || defaultMemberInfo();
  var updated = {title:current.title, assignedCategories:(current.assignedCategories||[]).slice(), canManageStaff:current.canManageStaff||false};
  if(patch.title!==undefined) updated.title = patch.title;
  if(patch.assignedCategories!==undefined){

        newCats = newCats.filter(function(c){ return myEff.indexOf(c)!==-1; });

    updated.assignedCategories = newCats;
  }
  if(patch.canManageStaff!==undefined && ME.uid===MY_CLUB.adminUid){
    updated.canManageStaff = !!patch.canManageStaff;
  }
  mi[uid] = updated;
  MY_CLUB.memberInfo = mi;

function clubAdminTeamRows(){

    if(!alertsByCat[a.category]) alertsByCat[a.category] = {punch:0, medical:0};
    if(a.type==='punch') alertsByCat[a.category].punch++;
    else if(a.type==='medical') alertsByCat[a.category].medical++;
  });
  var rows = [];
  AGE_GROUPS.forEach(function(cat){
    var t = CLUB_TEAMS[cat];
    if(!t || !t.players || !t.players.length) return;
    var a = alertsByCat[cat] || {punch:0, medical:0};
    rows.push({
      category: cat,
      playersCount: t.players.length,
      coachName: getTeamCoachName(cat) || '—',
      lowPunchCount: a.punch,
      medicalCount: a.medical
    });
  });
  return rows;
}
function clubAdminCoachRows(rows){
  // best-effort association of teams/players per coach name, via getTeamCoachName matching
  var byCoach = {};
  rows.forEach(function(r){
    var name = r.coachName==='—' ? 'ללא מאמן משובץ' : r.coachName;
    if(!byCoach[name]) byCoach[name] = {name:name, teams:0, players:0};
    byCoach[name].teams++;
    byCoach[name].players += r.playersCount;
  });
  var list = [];
  for(var k in byCoach) list.push(byCoach[k]);
  return list;
}

/* ---------------- Team training plans (read-only, club-owner oversight) ----------------
   Training plans remain strictly coachUid-scoped storage (per the hard requirement); this view
   only ADDS a read-only fan-out query across every coach uid in the club, batched into chunks of
   10 (Firestore 'in' query limit), grouped by coach name. No edit/delete handlers are wired here.
   Restricted to the club OWNER only: plan documents carry no category field, so there is no clean
   linkage to a canManageStaff manager's effectiveCategories. Exposing this to scoped managers would
   risk leaking other coaches' plans outside their assigned categories, so it is intentionally
   owner-only for now. */
function chunkArray(arr, size){
  var out = [];
  for(var i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
function teamPlansViewHtml(plansByCoach, coachOrder){
  var body = coachOrder.length===0
    ? '<div class="muted" style="text-align:center;margin-top:10px">אין עדיין תוכניות אימון בצוות</div>'
    : coachOrder.map(function(uid){
        var name = CLUB_COACH_NAMES[uid] || uid;
        var plans = plansByCoach[uid] || [];
        var plansHtml = plans.length===0
          ? '<div class="muted" style="font-size:12px;margin-top:4px">אין תוכניות</div>'
          : plans.map(function(p){
              return '<div class="card" style="margin-top:6px"><b>'+p.name+'</b>'+
                '<div class="muted" style="margin-top:4px">'+(p.drills?p.drills.length:0)+' תרגילים</div>'+
              '</div>';
            }).join('');
        return '<div class="card"><div class="row"><b>👨‍🏫 '+name+'</b><span class="muted">'+plans.length+' תוכניות</span></div>'+plansHtml+'</div>';
      }).join('');
  return '<h3 style="margin-bottom:14px">📋 תוכניות אימון של הצוות</h3>'+body;
}
function openTeamPlansView(){
  if(!MY_CLUB || ME.uid!==MY_CLUB.adminUid) return; // owner-only (see note above)
  var uids = (MY_CLUB.coaches || []).slice();
  if(uids.indexOf(ME.uid)===-1) uids.push(ME.uid);
  if(uids.length===0){
    openModal(teamPlansViewHtml({}, []));
    return;
  }
  openModal('<div class="muted" style="text-align:center">טוען תוכניות...</div>');
  var chunks = chunkArray(uids, 10);
  Promise.all(chunks.map(function(chunk){
    return db.collection(P+'trainingplans').where('coachUid','in',chunk).get();
  })).then(function(snaps){
    var plansByCoach = {};
    var coachOrder = uids.slice();
    snaps.forEach(function(snap){
      snap.forEach(function(doc){
        var p = doc.data();
        if(!plansByCoach[p.coachUid]) plansByCoach[p.coachUid] = [];
        plansByCoach[p.coachUid].push(p);

/* ---------------- Pitch board (toolbox-based tactics editor) ---------------- */
var BASE_W = 600, BASE_H = 380;
var boardState = {elements:[], orientation:'h', view:'top', bgStyle:'classic'};
var boardHistory = [];
var addMode = null;
var pendingPlayerColor = '#1c2230';
var lineStart = null;
var selectedElId = null;
var editingPlan = null;
var editingDrills = [];
var editingDrillIndex = null;
var PLAYBACK_SPEED = 1;
var playState = {playing:false, timer:null, interval:null};

var PLAYER_COLORS = ['#1c2230','#e63946','#2a9d8f','#f4a300','#3b82f6','#ffffff'];
var TOOLBOX_ITEMS = [
  {type:'player', ic:'🧍', label:'שחקן'},
  {type:'gk', ic:'🧤', label:'שוער'},
  {type:'goal', ic:'🥅', label:'שער'},
  {type:'cone', ic:'🔺', label:'קונוס'},
  {type:'ball', ic:'⚽', label:'כדור'},
  {type:'arrow', ic:'➡️', label:'חץ'},
  {type:'line', ic:'➖', label:'קו'}
];
var POINT_TYPES = ['player','gk','goal','cone','ball'];
var LINE_TYPES = ['arrow','line'];

function pitchDims(orientation){
  return orientation==='v' ? {w:BASE_H, h:BASE_W} : {w:BASE_W, h:BASE_H};
}
function dispXY(x, y, orientation){
  return orientation==='v' ? {x:y, y:x} : {x:x, y:y};
}
function canonXY(x, y, orientation){
  return orientation==='v' ? {x:y, y:x} : {x:x, y:y};
}
function shapeMarkup(el, small){
  var sc = small ? 1 : (el.scale||1);
  if(el.type==='player' || el.type==='gk'){
    var color = el.type==='gk' ? '#f4c400' : el.color;
    if(small){
      return '<circle r="4" fill="'+color+'" stroke="#fff" stroke-width="0.5"/>';
    }
    var txtFill = color==='#ffffff' || color==='#f4c400' ? '#1c2230' : '#fff';
    var bw = 12*sc, bh = 14*sc, sw = 5.5*sc, sh = 6.5*sc;
    var sleeveL = '<rect x="'+(-bw/2-sw*0.7)+'" y="'+(-bh/2+1*sc)+'" width="'+(sw*0.8)+'" height="'+sh+'" rx="'+(1.2*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="0.8"/>';
    var sleeveR = '<rect x="'+(bw/2-sw*0.1)+'" y="'+(-bh/2+1*sc)+'" width="'+(sw*0.8)+'" height="'+sh+'" rx="'+(1.2*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="0.8"/>';
    var body = '<rect x="'+(-bw/2)+'" y="'+(-bh/2+1.5*sc)+'" width="'+bw+'" height="'+bh+'" rx="'+(2.5*sc)+'" fill="'+color+'" stroke="#fff" stroke-width="1"/>';
    var collar = '<path d="M'+(-2.4*sc)+','+(-bh/2+2*sc)+' L0,'+(-bh/2+4.6*sc)+' L'+(2.4*sc)+','+(-bh/2+2*sc)+'" fill="none" stroke="#fff" stroke-width="0.9"/>';
    var num = '<text x="0" y="'+(3.5*sc)+'" text-anchor="middle" font-size="'+(9*sc)+'" font-weight="bold" fill="'+txtFill+'">'+(el.num||'')+'</text>';
    var legs = '<path d="M'+(-3*sc)+','+(bh/2+1.5*sc)+' L'+(-3.5*sc)+','+(bh/2+5*sc)+' M'+(3*sc)+','+(bh/2+1.5*sc)+' L'+(3.5*sc)+','+(bh/2+5*sc)+'" fill="none" stroke="#3b2a1a" stroke-width="'+(2.2*sc)+'" stroke-linecap="round"/>';
    var head = '<circle cx="0" cy="'+(-bh/2-2.6*sc)+'" r="'+(2.6*sc)+'" fill="#e3ad7c" stroke="#3b2a1a" stroke-width="0.5"/>';
    return legs + sleeveL + sleeveR + body + collar + head + num;
  }
  if(el.type==='ball'){
    var r = (small?3:10)*sc;
    if(small){ return '<circle r="'+r+'" fill="#fff" stroke="#1c2230" stroke-width="0.5"/>'; }
    var pent = '';
    for(var i=0;i<5;i++){
      var ang = -Math.PI/2 + i*2*Math.PI/5;
      pent += (i===0?'M':'L')+(r*0.42*Math.cos(ang))+','+(r*0.42*Math.sin(ang))+' ';
    }
    pent += 'Z';
    var spokes = '';
    for(var k=0;k<5;k++){
      var a2 = -Math.PI/2 + k*2*Math.PI/5;
      spokes += '<line x1="'+(r*0.42*Math.cos(a2))+'" y1="'+(r*0.42*Math.sin(a2))+'" x2="'+(r*0.92*Math.cos(a2))+'" y2="'+(r*0.92*Math.sin(a2))+'" stroke="#1c2230" stroke-width="0.8"/>';
    }
    return '<circle r="'+r+'" fill="#fff" stroke="#1c2230" stroke-width="1"/>'+
      '<path d="'+pent+'" fill="#1c2230"/>'+spokes;
  }
  if(el.type==='goal'){
    var gw = (small?8:22)*sc, gh = (small?5:14)*sc;
    if(small){ return '<rect x="'+(-gw/2)+'" y="'+(-gh/2)+'" width="'+gw+'" height="'+gh+'" fill="none" stroke="#fff" stroke-width="1"/>'; }
    var net = '';
    var cols = 4, rows = 3;
    for(var c=1;c<cols;c++){
      var nx = -gw/2 + (gw/cols)*c;
      net += '<line x1="'+nx+'" y1="'+(-gh/2)+'" x2="'+nx+'" y2="'+(gh/2)+'" stroke="#fff" stroke-width="0.6" opacity="0.65"/>';
    }
    for(var rI=1;rI<rows;rI++){
      var ny = -gh/2 + (gh/rows)*rI;
      net += '<line x1="'+(-gw/2)+'" y1="'+ny+'" x2="'+(gw/2)+'" y2="'+ny+'" stroke="#fff" stroke-width="0.6" opacity="0.65"/>';
    }
    return '<rect x="'+(-gw/2)+'" y="'+(-gh/2)+'" width="'+gw+'" height="'+gh+'" fill="#1c2230" opacity="0.18" stroke="#fff" stroke-width="2.2"/>'+net;
  }
  if(el.type==='cone'){
    var s = (small?5:10)*sc;
    return '<path d="M0,-'+s+' L'+s+','+s+' L-'+s+','+s+' Z" fill="#f4731c" stroke="#fff" stroke-width="'+(small?0.5:1.5)+'"/>';
  }
  return '';
}
function selHighlight(el){
  var s = (el.type==='player'?15:12)*(el.scale||1);
  return '<rect x="-'+s+'" y="-'+s+'" width="'+(s*2)+'" height="'+(s*2)+'" fill="none" stroke="#fff200" stroke-width="2"/>';
}
var BG_STYLES = {
  classic: {a:'#3eac46', b:'#369b3d'},
  dark: {a:'#1f5c2a', b:'#1a4f24'},
  light: {a:'#6fc977', b:'#62b86a'},
  blue: {a:'#2e6fb0', b:'#27619c'}
};
function pitchSvgMarkup(elements, small, orientation, svgId, bgStyle){
  var dims = small ? {w:60,h:40} : pitchDims(orientation);
  var w = dims.w, h = dims.h;
  var sx = small ? 60/BASE_W : 1, sy = small ? 40/BASE_H : 1;
  var sw = small ? 1 : 2;
  var portrait = !small && orientation==='v';
  var boxDepth = portrait ? h*0.16 : w*0.16, boxH = portrait ? w*0.6 : h*0.6;
  var gaDepth = portrait ? h*0.06 : w*0.06, gaH = portrait ? w*0.3 : h*0.3;
  var bg = BG_STYLES[bgStyle] || BG_STYLES.classic;
  var stripes = '';
  var stripeCount = small ? 6 : 12;
  var stripeW = portrait ? h/stripeCount : w/stripeCount;
  for(var si=0; si<stripeCount; si++){
    stripes += portrait ?
      ('<rect x="0" y="'+(si*stripeW)+'" width="'+w+'" height="'+stripeW+'" fill="'+(si%2===0?bg.a:bg.b)+'"/>') :
      ('<rect x="'+(si*stripeW)+'" y="0" width="'+stripeW+'" height="'+h+'" fill="'+(si%2===0?bg.a:bg.b)+'"/>');
  }
  var lines = stripes+'<rect x="2" y="2" width="'+(w-4)+'" height="'+(h-4)+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
    (portrait ?
      ('<line x1="2" y1="'+(h/2)+'" x2="'+(w-2)+'" y2="'+(h/2)+'" stroke="#fff" stroke-width="'+sw+'"/>') :
      ('<line x1="'+(w/2)+'" y1="2" x2="'+(w/2)+'" y2="'+(h-2)+'" stroke="#fff" stroke-width="'+sw+'"/>')
    )+
    '<circle cx="'+(w/2)+'" cy="'+(h/2)+'" r="'+(small?6:40)+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
    (portrait ?
      ('<rect x="'+((w-boxH)/2)+'" y="2" width="'+boxH+'" height="'+boxDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-boxH)/2)+'" y="'+(h-2-boxDepth)+'" width="'+boxH+'" height="'+boxDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-gaH)/2)+'" y="2" width="'+gaH+'" height="'+gaDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+((w-gaH)/2)+'" y="'+(h-2-gaDepth)+'" width="'+gaH+'" height="'+gaDepth+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>') :
      ('<rect x="2" y="'+((h-boxH)/2)+'" width="'+boxDepth+'" height="'+boxH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+(w-2-boxDepth)+'" y="'+((h-boxH)/2)+'" width="'+boxDepth+'" height="'+boxH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="2" y="'+((h-gaH)/2)+'" width="'+gaDepth+'" height="'+gaH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>'+
       '<rect x="'+(w-2-gaDepth)+'" y="'+((h-gaH)/2)+'" width="'+gaDepth+'" height="'+gaH+'" fill="none" stroke="#fff" stroke-width="'+sw+'"/>')
    );
  var linesHtml = elements.filter(function(el){ return LINE_TYPES.indexOf(el.type)>=0; }).map(function(el){
    var p1 = small ? {x:el.x1, y:el.y1} : dispXY(el.x1, el.y1, orientation);
    var p2 = small ? {x:el.x2, y:el.y2} : dispXY(el.x2, el.y2, orientation);
    var marker = el.type==='arrow' ? ' marker-end="url(#arrowhead)"' : '';
    var dash = el.type==='line' ? ' stroke-dasharray="5,4"' : '';
    return '<line x1="'+(p1.x*sx)+'" y1="'+(p1.y*sy)+'" x2="'+(p2.x*sx)+'" y2="'+(p2.y*sy)+'" stroke="#fff200" stroke-width="'+(small?1.5:3)+'"'+marker+dash+'/>';
  }).join('');
  var pointsHtml = elements.filter(function(el){ return POINT_TYPES.indexOf(el.type)>=0; }).map(function(el){
    var p = small ? {x:el.x, y:el.y} : dispXY(el.x, el.y, orientation);
    var dx = p.x*sx, dy = p.y*sy;
    var sel = (!small && el.id===selectedElId) ? selHighlight(el) : '';
    return '<g class="elem-token" data-id="'+el.id+'" data-type="'+el.type+'" transform="translate('+dx+','+dy+')" style="cursor:'+(small?'default':'grab')+'">'+sel+shapeMarkup(el, small)+'</g>';
  }).join('');
  return '<svg id="'+(svgId||'pitchSvg')+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fff200"/></marker></defs>'+
    lines + linesHtml + pointsHtml +
  '</svg>';
}

function loadDrillToBoard(i){

  boardState.elements = d.elements.map(function(e){ var c={}; for(var k in e) c[k]=e[k]; return c; });

function newDrillFrame(){
  boardState.elements = [];
  editingDrillIndex = null;

}
function saveCurrentFrame(){
  var frame = {
    elements: boardState.elements.map(function(e){
      var c = {id:e.id, type:e.type};
      if(POINT_TYPES.indexOf(e.type)>=0){ c.x=e.x; c.y=e.y; c.scale=e.scale||1; if(e.type==='player'){ c.color=e.color; c.num=e.num; } else if(e.type==='gk'){ c.num=e.num; } }
      else { c.x1=e.x1; c.y1=e.y1; c.x2=e.x2; c.y2=e.y2; }
      return c;
    }),
    note: (document.getElementById('drillNoteInput').value||'').trim()
  };
  if(editingDrillIndex!==null){
    editingDrills[editingDrillIndex] = frame;
  } else {
    editingDrills.push(frame);
    editingDrillIndex = editingDrills.length-1;
  }
}
function nextPlayerNum(){
  var nums = boardState.elements.filter(function(e){return e.type==='player';}).map(function(e){return e.num;});
  var n = 1;
  while(nums.indexOf(n)>=0) n++;
  return n;
}
function renderPlanBuilderModal(){
  var frameLabel = editingDrillIndex!==null ? ('פריים '+(editingDrillIndex+1)+' מתוך '+editingDrills.length) : ('פריים חדש #'+(editingDrills.length+1));
  var body = ''+
  '<button class="btn ghost sm" id="btnCloneFromCoachTraining" style="margin-bottom:10px">📑 שכפל מתבנית</button>'+
  '<div class="frame-status">'+frameLabel+(addMode?' · לחץ/י על המגרש למיקום ה'+(TOOLBOX_ITEMS.filter(function(t){return t.type===addMode;})[0]||{}).label:'')+'</div>'+
  '<div class="pitch-stage">'+
    '<div class="pitch-wrap">'+pitchSvgMarkup(boardState.elements, false, boardState.orientation, 'pitchSvg', boardState.bgStyle)+'</div>'+
  '</div>'+
  '<div class="tool-strip">'+
    TOOLBOX_ITEMS.map(function(item){
      return '<button class="tbx-btn '+(addMode===item.type?'sel':'')+'" data-tool="'+item.type+'">'+item.ic+'<span>'+item.label+'</span></button>';
    }).join('')+
  '</div>'+
  (addMode==='player'
    ? '<div class="color-row">'+PLAYER_COLORS.map(function(c){
        return '<button class="color-sw '+(pendingPlayerColor===c?'sel':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';

function aiPlanAllPlayers(){

  });
  return out;
}
function aiPlanPrefillInjury(targetName){
  var found = aiPlanAllPlayers().filter(function(x){ return x.name===targetName; })[0];

  if(pl.injury_status==='injured' || pl.injury_status==='rehab'){

  }
  return '';
}

/* Fixed curated exercise bank for now (no real AI call). Kept as a
   single function so it can be swapped for a server-side AI-generated
   plan later without touching the surrounding UI/data flow. */
function buildAiPlanPhases(topics){
  var phases = [];
  var wu = WARMUP_LIBRARY[Math.floor(Math.random()*WARMUP_LIBRARY.length)];
  phases.push({name:'חימום', items:[{title:wu.title, description:wu.description, duration_min:wu.duration_min}]});
  topics.forEach(function(topic){
    var bank = AI_TOPIC_EXERCISE_BANK[topic] || [];
    var items = bank.slice(0,2).map(function(ex){ return {title:ex.title, description:ex.description, duration_min:ex.duration_min}; });
    if(items.length===0) items.push({title:topic, description:'תרגול ממוקד בנושא '+topic, duration_min:15});
    phases.push({name:topic, items:items});
  });
  var cd = COOLDOWN_LIBRARY[Math.floor(Math.random()*COOLDOWN_LIBRARY.length)];
  phases.push({name:'שחרור וסיום', items:[{title:cd.title, description:cd.description, duration_min:cd.duration_min}]});
  return phases;
}

/* ---------------- Season weeks (progressive lock) ---------------- */
function addPlanWeek(){
  if(!editingPlan.weeks) editingPlan.weeks = [];
  var status = editingPlan.weeks.length===0 ? 'open' : 'locked';
  editingPlan.weeks.push({label:'שבוע '+(editingPlan.weeks.length+1), status:status, notes:''});
  renderPlanBuilderModal();
}
function removePlanWeek(wIdx){
  if(!confirm('להסיר את השבוע?')) return;
  editingPlan.weeks.splice(wIdx,1);
  renderPlanBuilderModal();
}
function advancePlanWeek(wIdx){
  var weeks = editingPlan.weeks || [];
  if(!weeks[wIdx] || weeks[wIdx].status !== 'open') return;
  weeks[wIdx].status = 'done';
  for(var i=wIdx+1;i<weeks.length;i++){
    if(weeks[i].status === 'locked'){ weeks[i].status = 'open'; break; }
  }
  renderPlanBuilderModal();
}
function updatePlanWeekNotes(wIdx, notes){
  if(!editingPlan.weeks || !editingPlan.weeks[wIdx]) return;
  editingPlan.weeks[wIdx].notes = notes;
}

  var weeks = editingPlan.weeks || [];

    '<div class="muted" style="margin-bottom:10px">חלוקת התוכנית לשבועות עם נעילה מתקדמת — שבוע נפתח אוטומטית כשהשבוע הנוכחי מסתיים</div>';
  if(weeks.length===0){
    html += '<div class="muted" style="margin-bottom:10px">עדיין לא הוגדרו שבועות</div>';
  } else {
    html += weeks.map(function(w, wIdx){
      var icon = w.status==='done' ? '✅' : (w.status==='open' ? '🔓' : '🔒');
      var isLocked = w.status==='locked';

function animateFrameTransition(area, fromEls, toEls, onDone, speed){
  area.innerHTML = pitchSvgMarkup(toEls, false, 'h', 'playSvg', boardState.bgStyle);
  var fromById = {};
  fromEls.forEach(function(e){ if(POINT_TYPES.indexOf(e.type)>=0) fromById[e.id] = e; });
  var moves = [];
  toEls.forEach(function(e){
    if(POINT_TYPES.indexOf(e.type)<0) return;
    var prev = fromById[e.id];
    if(!prev) return;
    if(prev.x===e.x && prev.y===e.y) return;
    var token = area.querySelector('[data-id="'+e.id+'"]');
    if(!token) return;
    var p1 = dispXY(prev.x, prev.y, 'h');
    var p2 = dispXY(e.x, e.y, 'h');
    moves.push({token:token, x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y});
  });
  if(moves.length===0){ playState.timer = setTimeout(onDone, 700/speed); return; }
  var svgEl = area.querySelector('svg');
  if(svgEl){
    moves.forEach(function(m){
      var trail = document.createElementNS('http://www.w3.org/2000/svg','line');
      trail.setAttribute('x1', m.x1); trail.setAttribute('y1', m.y1);
      trail.setAttribute('x2', m.x2); trail.setAttribute('y2', m.y2);
      trail.setAttribute('stroke', '#fff200'); trail.setAttribute('stroke-width', '2');
      trail.setAttribute('stroke-dasharray', '4,4');
      trail.setAttribute('marker-end', 'url(#arrowhead)');
      trail.setAttribute('opacity', '0.85');
      svgEl.insertBefore(trail, m.token.parentNode===svgEl ? m.token : null);
    });
  }
  var steps = 24, dur = 900/speed, step = 0;
  moves.forEach(function(m){ m.token.setAttribute('transform','translate('+m.x1+','+m.y1+')'); });
  var iv = setInterval(function(){
    if(!playState.playing){ clearInterval(iv); return; }
    step++;
    var t = step/steps;
    if(t>1) t = 1;
    var ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
    moves.forEach(function(m){
      var x = m.x1 + (m.x2-m.x1)*ease;
      var y = m.y1 + (m.y2-m.y1)*ease;
      m.token.setAttribute('transform','translate('+x+','+y+')');
    });
    if(step>=steps){
      clearInterval(iv);
      playState.interval = null;
      playState.timer = setTimeout(onDone, 400/speed);
    }
  }, dur/steps);
  playState.interval = iv;
}
function playDrills(){
  stopPlayback();
  var area = document.getElementById('drillPlayArea');
  if(!area || editingDrills.length===0) return;
  playState.playing = true;
  area.innerHTML = pitchSvgMarkup(editingDrills[0].elements, false, 'h', 'playSvg', boardState.bgStyle);
  var i = 0;
  function nextFrame(){
    if(!playState.playing) return;
    if(i>=editingDrills.length-1){ playState.playing = false; return; }
    var from = editingDrills[i].elements, to = editingDrills[i+1].elements;
    i++;
    animateFrameTransition(area, from, to, nextFrame, getPlaybackSpeed());
  }
  playState.timer = setTimeout(nextFrame, 700/getPlaybackSpeed());
}
function svgPoint(svg, evt){
  var rect = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  var touch = (evt.changedTouches && evt.changedTouches[0]) || (evt.touches && evt.touches[0]);
  var clientX = touch ? touch.clientX : evt.clientX;
  var clientY = touch ? touch.clientY : evt.clientY;
  var x = (clientX - rect.left) / rect.width * vb.width;
  var y = (clientY - rect.top) / rect.height * vb.height;
  return {x:x, y:y};
}
var pitchDragging = null;
var pitchTapHandled = false;
function handlePitchTap(svg, evt){
  if(pitchDragging) return;
  if(evt.target && evt.target.closest && evt.target.closest('.elem-token')) return;
  if(!addMode) return;
  var pt = svgPoint(svg, evt);
  var canon = canonXY(pt.x, pt.y, boardState.orientation);
  if(POINT_TYPES.indexOf(addMode)>=0){
    pushHistory();
    var el = {id:genCode(6), type:addMode, x:canon.x, y:canon.y, scale:1};
    if(addMode==='player'){ el.color = pendingPlayerColor; el.num = nextPlayerNum(); }
    if(addMode==='gk'){ el.num = 'GK'; }
    boardState.elements.push(el);
    renderPlanBuilderModal();
  } else {
    if(!lineStart){
      lineStart = canon;
    } else {
      pushHistory();
      boardState.elements.push({id:genCode(6), type:addMode, x1:lineStart.x, y1:lineStart.y, x2:canon.x, y2:canon.y});
      lineStart = null;
      renderPlanBuilderModal();
    }
  }
}
function touchDist(touches){
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
function wirePitchSvg(){
  var svg = document.getElementById('pitchSvg');
  if(!svg) return;
  document.querySelectorAll('.elem-token').forEach(function(token){
    token.addEventListener('mousedown', function(e){ startDrag(token); e.stopPropagation(); });
    token.addEventListener('touchstart', function(e){
      var id = token.dataset.id;
      if(e.touches.length>=2){
        e.preventDefault();
        var el = boardState.elements.filter(function(x){return x.id===id;})[0];
        if(el && POINT_TYPES.indexOf(el.type)>=0){
          selectedElId = id;
          pitchDragging = null;
          pinchState = {id:id, initialDist:touchDist(e.touches), initialScale: el.scale||1};
        }
      } else {
        startDrag(token);
      }
      e.stopPropagation();
    }, {passive:false});
  });
  svg.addEventListener('click', function(e){
    if(pitchTapHandled){ pitchTapHandled = false; return; }
    handlePitchTap(svg, e);
  });
  svg.addEventListener('touchend', function(e){
    pitchTapHandled = true;
    e.preventDefault();
    handlePitchTap(svg, e);
  });
}
function startDrag(token){
  if(addMode) return;
  var id = token.dataset.id;
  selectedElId = id;
  pitchDragging = boardState.elements.filter(function(e){return e.id===id;})[0];
  if(pitchDragging) pushHistory();
}
function resizeSelected(delta){
  if(!selectedElId) return;
  var el = boardState.elements.filter(function(e){return e.id===selectedElId;})[0];
  if(!el || POINT_TYPES.indexOf(el.type)<0) return;
  pushHistory();
  el.scale = Math.max(0.5, Math.min(2.5, (el.scale||1)+delta));
  renderPlanBuilderModal();
}
var pinchState = null;
document.addEventListener('mousemove', onPitchDragMove);
document.addEventListener('touchmove', onPitchDragMove, {passive:false});
document.addEventListener('touchmove', onPitchPinchMove, {passive:false});
document.addEventListener('mouseup', onPitchDragEnd);
document.addEventListener('touchend', onPitchDragEnd);
document.addEventListener('touchend', onPitchPinchEnd);
function onPitchDragMove(e){
  if(!pitchDragging) return;
  var svg = document.getElementById('pitchSvg');
  if(!svg) return;
  e.preventDefault();
  var pt = svgPoint(svg, e);
  var dims = pitchDims(boardState.orientation);
  var dx = Math.max(10,Math.min(dims.w-10,pt.x));
  var dy = Math.max(10,Math.min(dims.h-10,pt.y));
  var canon = canonXY(dx, dy, boardState.orientation);
  pitchDragging.x = canon.x;
  pitchDragging.y = canon.y;
  var g = svg.querySelector('.elem-token[data-id="'+pitchDragging.id+'"]');
  if(g){ g.setAttribute('transform', 'translate('+dx+','+dy+')'); }
}
function onPitchDragEnd(){
  if(pitchDragging){ pitchDragging = null; renderPlanBuilderModal(); }
}
function onPitchPinchMove(e){
  if(!pinchState || e.touches.length<2) return;
  e.preventDefault();
  var el = boardState.elements.filter(function(x){return x.id===pinchState.id;})[0];
  if(!el) return;
  var d = touchDist(e.touches);
  el.scale = Math.max(0.5, Math.min(2.5, pinchState.initialScale * (d / pinchState.initialDist)));
  var svg = document.getElementById('pitchSvg');
  var g = svg && svg.querySelector('.elem-token[data-id="'+el.id+'"]');
  if(g){
    var sel = el.id===selectedElId ? selHighlight(el) : '';
    g.innerHTML = sel + shapeMarkup(el, false);
  }
}
function onPitchPinchEnd(e){
  if(pinchState && e.touches.length<2){
    pinchState = null;
    renderPlanBuilderModal();
  }
}
function genCode(len){
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '';
  for(var i=0;i<len;i++) s += chars.charAt(Math.floor(Math.random()*chars.length));
  return s;
}

function cleanPhoneForWa(phone){
  if(!phone) return '';
  var digits = (''+phone).replace(/\D/g,'');
  if(!digits) return '';
  if(digits.charAt(0)==='0') digits = '972'+digits.substring(1);
  else if(digits.indexOf('972')!==0 && digits.length<=10) digits = '972'+digits;
  return digits;
}
function planTextSummary(plan){
  var lines = [];
  lines.push('תוכנית אימון — '+(plan.name||'ללא שם'));
  var phases = plan.phases || [];
  if(phases.length){
    lines.push('');
    lines.push('שלבי האימון:');
    phases.forEach(function(ph){
      lines.push('• '+ph.name);
      (ph.items||[]).forEach(function(it){
        lines.push('   - '+it.title+(it.duration_min?' ('+it.duration_min+' דק׳)':'')+(it.notes?' — '+it.notes:''));
      });
    });
  }
  var weeks = plan.weeks || [];
  if(weeks.length){
    lines.push('');
    lines.push('שלבי עונה:');
    weeks.forEach(function(w){
      var statusT = w.status==='done' ? 'הושלם' : (w.status==='open' ? 'פתוח' : 'נעול');
      lines.push('• '+w.label+' ('+statusT+')'+(w.notes?' — '+w.notes:''));
    });
  }
  return lines.join('\n');
}
function playerReportSummaryText(player, category){

    lines.push('כרטיסיית ניקובים: נותרו '+(typeof p.remaining_punches==='number'?p.remaining_punches:'-')+' מתוך '+(typeof p.total_punches==='number'?p.total_punches:'-'));
  } else if(p.sub_type==='monthly'){
    lines.push('מנוי חודשי: '+(p.sub_status==='active'?'פעיל':(p.sub_status==='frozen'?'מוקפא':'פג תוקף')));
  }
  lines.push('אישור רפואי: '+(p.medical_approval?('בתוקף'+(p.medical_expiry?' עד '+p.medical_expiry:'')):'אין אישור רפואי בתוקף'));
  var injStatus = p.injury_status || 'healthy';

    lines.push('סטטוס פציעה: '+INJURY_STATUS_INFO[injStatus].t+(p.injury_expected_return?' · חזרה משוערת '+p.injury_expected_return:''));

function attendancePctForPlayer(player, category){
  var stats = countPlayerAttendance(player.name);
  // total scheduled session-slots this player is assigned to attend, across the team's recurring weekly schedule
  var total = 0;
  PITCHES.forEach(function(pt){
    DAYS.forEach(function(d){
      var sessions = (pt.schedule && pt.schedule[d.k]) || [];
      sessions.forEach(function(s){
        var att = s.attendance || {};
        if(att[player.name]!==undefined) total++;
      });
    });
  });
  var pct = total>0 ? Math.round((stats.present/total)*100) : 0;
  return {pct:pct, present:stats.present, total:total, maxStreak:stats.maxStreak};
}
